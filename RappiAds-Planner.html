<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RappiAds Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap">
<style>
/* Layout: réplica navegable de las pantallas del Figma. Barra superior con marca y cuenta, contenido en 1184px, tarjetas blancas sobre fondo gris claro. Una sola apariencia (clara), igual que el diseño. */
:root{
  --bg:#F7F7FA; --card:#FFFFFF; --fg:#1E1E24; --muted:#6C6C78; --line:#ECECF0; --chip:#F0F0F3; --chipfg:#4A4A55;
  --coral:#FF441F; --pink:#FF2050; --grad:linear-gradient(90deg,#FF441F,#FF2050);
  --peach:#FFE9E0; --blue:#E4EEFF; --mint:#DFF6E8; --green:#17995C; --amber:#B7791F; --amberbg:#FFF1D0; --red:#D93333; --redbg:#FFE6E6;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #1E1E24;outline-offset:2px}

/* nav */
.nav{background:#fff;height:68px;border-bottom:4px solid transparent;border-image:var(--grad) 1;display:flex;align-items:center;justify-content:space-between;padding-inline:16px 16px;position:sticky;top:0;z-index:30}
@media(min-width:900px){.nav{padding-inline:48px}}
.brand{background:none;border:0;padding:0;display:flex;align-items:center}
.brand img{height:40px;width:auto;display:block}
.acct{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;font-weight:500}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:88px;height:88px;font-size:30px}
.avatar.md{width:56px;height:56px;font-size:20px}
.menu-scrim{position:fixed;inset:0;z-index:40;background:transparent}
.menu{position:fixed;top:72px;right:16px;z-index:41;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(30,30,36,.14);padding:8px;width:210px;display:flex;flex-direction:column}
@media(min-width:900px){.menu{right:48px}}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500}
.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}

/* layout */
.page{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:20px 90px}
@media(min-width:900px){.page{padding-inline:48px}}
.crumbs{color:var(--muted);font-size:13px;margin:0 0 4px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--coral)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px;line-height:1.2;font-weight:600;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0;font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:20px;align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-prof{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}
@media(max-width:860px){.g3,.g2,.g-main,.g-eq,.g-prof{grid-template-columns:minmax(0,1fr)}}
.mrow{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px;display:grid;grid-template-columns:44px minmax(0,1fr) 190px;gap:6px 18px;align-items:center}
@media(max-width:600px){.mrow{grid-template-columns:44px minmax(0,1fr)}.mrow>input.field{grid-column:1/-1}.mrow>.row{grid-column:1/-1!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card.hot{border:2px solid var(--coral)}
.sec{font-size:16px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px}
.lbl{font-size:12px;color:var(--muted);margin:18px 0 8px;display:block}
.lbl:first-child{margin-top:0}

/* buttons, chips, inputs */
.btn{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:12px;padding:12px 22px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#d6d6dd}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.pri:hover{background:#ee3a17}
.btn.big{padding:16px 28px;border-radius:14px}
.btn.wide{width:100%}
.btn.white{border-color:#fff}
.btn.white{color:var(--coral)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--chip);color:var(--chipfg);border:1px solid transparent;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500}
.chip:hover{background:#e6e6ea}
.chip.on{background:var(--coral);color:#fff}
.chip.sm{padding:6px 12px;font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:500;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--mint);color:var(--green)}
.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.hot{background:var(--coral);color:#fff}
.pill.peach{background:var(--peach);color:var(--coral)}
.pill.bad{background:var(--redbg);color:var(--red)}
.field{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.field:focus{outline:2px solid var(--coral);border-color:var(--coral)}
.field.sm{padding:12px 14px;font-size:14px}
.field.money{font-size:20px;font-weight:600;border-color:var(--coral)}
.opt{display:block;text-align:left;width:100%;background:var(--chip);border:1px solid transparent;border-radius:14px;padding:12px 16px;font-weight:500}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.opt.on{background:var(--peach);border-color:var(--coral)}
.opt.on small{color:var(--chipfg)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tgl{width:46px;height:26px;border-radius:999px;background:#E4E4E9;border:0;position:relative;flex:none;padding:0;transition:background .15s}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tgl.on{background:var(--coral)}
.tgl.on::after{left:23px}
.trow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:8px 0}
.trow b{display:block;font-weight:600;font-size:14px}
.trow span{color:var(--muted);font-size:12px}
.chk{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--muted);font-size:13px}
.chk i{width:20px;height:20px;border-radius:6px;border:2px solid #CFCFD6;display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:12px}
.chk.on i{background:var(--coral);border-color:var(--coral)}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid #CFCFD6;flex:none;display:grid;place-items:center}
.mark.on{border-color:var(--coral)}
.mark.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral)}
.bar{height:6px;border-radius:99px;background:#E8E8EC;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--coral) var(--p,50%),#E4E4E9 var(--p,50%));outline-offset:6px;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--coral);box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:grab}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--coral);cursor:grab}

/* stepper */
.steps{display:flex;gap:8px}
.step{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--muted)}
.step.cur{background:var(--coral);color:#fff;font-weight:500}
.step.done{background:var(--mint);color:var(--green)}
.prog{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:240px;margin-top:6px}
.prog i{height:5px;border-radius:99px;background:#E8E8EC}
.prog i.on{background:var(--coral)}

/* tiles */
.stat{padding:20px 22px}
.stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat strong{display:block;font-size:26px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat span.up{color:var(--green)}
.camp{padding:0;overflow:hidden;cursor:pointer;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;display:block;width:100%}
.camp:hover{box-shadow:0 8px 24px rgba(30,30,36,.08)}
.camp .top{height:120px;display:grid;place-items:center}
.camp .top i{width:62px;height:62px;border-radius:16px;background:#fff}
.camp .body{padding:16px 18px 18px}
.camp h3{margin:0 0 8px;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.camp p{margin:2px 0;color:var(--muted);font-size:13px}
.banner{background:var(--grad);color:#fff;border-radius:20px;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px}
.tint{background:var(--peach);border-radius:14px;padding:14px 18px;font-weight:600;font-size:13px}
.note{background:var(--peach);border-radius:14px;padding:12px 16px;font-size:13px}
.note b{display:block;color:var(--coral);font-size:12px;margin-bottom:2px}
.sumrow{background:var(--bg);border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
.sumrow small{display:block;color:var(--muted);font-size:11px}
.sumrow b{font-weight:600;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--coral);font-weight:500;font-size:12px;text-decoration:none}
.link:hover{text-decoration:underline}

/* format recommendation cards */
.fmt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;color:inherit}
.fmt.on{border:2px solid var(--coral);padding:13px 15px}
.fmt .t{display:flex;gap:12px;align-items:center}
.fmt .t b{flex:1;font-size:15px;font-weight:600}
.fmt p{margin:6px 0 6px 34px;color:var(--muted);font-size:12px}
.fmt small{margin-left:34px;font-weight:600;font-size:11px}
.adatag{background:var(--coral);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;margin-right:8px}
.adahead{display:flex;align-items:center;font-size:18px;font-weight:600;margin-bottom:6px}
.photo{border-radius:16px;display:grid;place-items:center;color:var(--muted);font-size:12px;border:0}
.photo.add{border:1.5px dashed #D3D3DA;background:#fff}

/* data bits */
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0}
.kv b{font-weight:600}
.table{width:100%;border-collapse:collapse}
.table th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;font-weight:500}
.table td{padding:16px;border-top:1px solid var(--line);font-size:14px}
.table tr.rw{cursor:pointer}
.table tr.rw:hover td{background:#FBFBFD}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.tab{background:none;border:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted)}
.tab.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.notif{display:flex;gap:14px;align-items:center;padding:18px 22px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.notif:first-child{border-top:0}
.notif .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none}
.notif .dot.read{background:transparent}
.notif b{display:block;font-size:15px;font-weight:600}
.notif span{color:var(--muted);font-size:13px}
.notif time{color:var(--muted);font-size:12px;white-space:nowrap}
.faq{border-top:1px solid var(--line)}
.faq button{width:100%;display:flex;justify-content:space-between;gap:12px;background:none;border:0;padding:16px 0;font-size:15px;text-align:left}
.faq button em{color:var(--coral);font-style:normal;font-weight:700;font-size:18px}
.faq p{margin:0 0 16px;color:var(--muted);font-size:13px}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
@media(max-width:860px){.auth{grid-template-columns:minmax(0,1fr)}}
.auth-l{background:var(--grad);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:860px){.auth-l{padding:32px 24px}}
.auth-l img{width:min(392px,100%);height:auto;margin:0 0 12px -8px;display:block}
.auth-l h2{font-size:38px;line-height:1.5;font-weight:600;margin:0 0 20px;text-wrap:balance}
@media(max-width:600px){.auth-l h2{font-size:28px}}
.auth-l p{font-size:18px;font-weight:300;line-height:1.7;margin:0 0 24px;max-width:480px}
.auth-l ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-weight:600;font-size:16px}
.auth-l li::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#fff;margin-right:14px}
.auth-r{padding:48px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.auth-r .box{width:min(400px,100%)}
.auth-r h3{font-size:32px;font-weight:600;margin:0}
.auth-r .foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.fl{display:block;font-weight:600;font-size:13px;margin:18px 0 8px}
.pbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.pbar i{height:4px;border-radius:99px;background:#E8E8EC}
.pbar i.on{background:var(--coral)}
.upl{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;text-align:left}
.upl i{width:44px;height:44px;border-radius:12px;background:var(--peach);display:grid;place-items:center;color:var(--coral);font-style:normal;font-size:22px;font-weight:600;flex:none;overflow:hidden}
.upl i img{width:100%;height:100%;object-fit:cover}
.upl b{display:block;font-size:13px}
.upl span{font-size:12px;color:var(--muted)}
.chk-ok{width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.chk-no{width:26px;height:26px;border-radius:50%;border:2px solid #CFCFD6;flex:none}
.num{width:26px;height:26px;border-radius:50%;background:var(--peach);color:var(--coral);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

/* charts */
.bars{display:flex;align-items:flex-end;gap:clamp(8px,2.4%,28px);height:210px;border-bottom:1px solid var(--line);position:relative;padding-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;font-weight:600}
.bars .c i{display:block;width:min(100%,56px);border-radius:10px 10px 4px 4px;background:#FFB09E;margin-top:4px;transition:height .35s}
.bars .c i.hi{background:var(--coral)}
.xl{display:flex;gap:clamp(8px,2.4%,28px);margin-top:8px;color:var(--muted);font-size:12px}
.xl span{flex:1;text-align:center}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--green);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.ret{display:flex;align-items:center;gap:14px;padding:10px 0}
.ret .sq{width:36px;height:36px;border-radius:10px;flex:none}
.ret .nm{flex:1;min-width:0}
.ret .nm b{display:block;font-size:14px;font-weight:600}
.ret .nm span{font-size:12px;color:var(--muted)}
.ret strong{font-size:18px;font-weight:700}

/* reparto chart (04) */
.chartw{display:grid;grid-template-columns:44px minmax(0,1fr);padding-block:30px 8px}
.axis{position:relative;height:320px}
.axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.plot{position:relative;height:320px;touch-action:none}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.col{position:absolute;top:0;bottom:0;width:33.333%}
.ghost{position:absolute;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px dashed #B9A9A2;background:#fff}
.move{position:absolute;left:50%;width:3px;margin-left:-1.5px;border-radius:2px;opacity:.9}
.dcard{position:absolute;left:50%;width:min(168px,94%);transform:translate(-50%,-50%);background:#fff;border:2px solid var(--coral);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 14px rgba(255,68,31,.18);transition:top .45s cubic-bezier(.2,.8,.2,1)}
.dcard.drag{cursor:grabbing;transition:none;z-index:5;box-shadow:0 10px 26px rgba(255,68,31,.35)}
.dcard .th{flex:none;width:34px;height:34px;border-radius:8px}
.dcard .nm{font-size:11px;font-weight:500;line-height:1.2;display:block;overflow-wrap:anywhere}
.dcard .am{font-size:15px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.dl{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.dl.up{background:var(--mint);color:var(--green)}
.dl.down{background:var(--redbg);color:var(--red)}
.dl.flat{background:var(--chip);color:var(--muted)}
.xcap{display:grid;grid-template-columns:44px repeat(3,1fr);font-size:12px;color:var(--muted);text-align:center}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0;margin:0;padding:0}
.prow b{font-weight:600;font-size:13px}
.prow .rg{color:var(--muted);font-size:12px}
.mini{background:var(--bg);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.mini small{font-size:11px;color:var(--muted)}
.mini strong{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1E1E24;color:#fff;border-radius:999px;padding:12px 22px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.jump{position:fixed;left:16px;bottom:16px;z-index:50;background:#1E1E24;color:#fff;border:0;border-radius:999px;padding:10px 14px;font-size:12px;max-width:240px}
@media(max-width:600px){.dcard{width:97%;padding:6px 8px;gap:0}.dcard .th{display:none}.dcard .nm{font-size:10px}.dcard .am{font-size:13px}.dl{font-size:10px;padding:1px 6px}.chartw{grid-template-columns:38px minmax(0,1fr)}}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){return '$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function mm(v,d){d=d==null?1:d;return '$'+(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace('.',',')+'M';}
function dm(v){var r=Math.round(v*10)/10;return r>0?'+'+mm(r):r<0?'−'+mm(Math.abs(r)):'$0,0M';}
function num(s){var n=parseFloat(String(s).replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function getp(path){var p=path.split('.'),o=S;for(var i=0;i<p.length;i++){if(o==null)return undefined;o=o[p[i]];}return o;}
function setp(path,v){var p=path.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;}
function initials(n){var w=String(n).trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]?w[1][0]:(w[0]||'')[1]||'')).toUpperCase();}
function lc(s){return String(s).charAt(0).toLowerCase()+String(s).slice(1);}

var REC=[.5,.28,.22], OLD=[.42,.18,.40], TYP=['Banner en home','Turbo','Por zona'], THC=['#FFB020','#FF441F','#7C5CFF'];
function cnames(){return S.user.nube?TYP.slice():[S.F.name||'Lanzamiento Verano','Recompra Turbo','Fin de semana en tu zona'];}
function roasOf(f){var s=0,l1=0,t=f[0]+f[1]+f[2];if(t<=0)return 0;for(var i=0;i<3;i++){var g=f[i]/t;s+=Math.pow(REC[i],.3)*Math.pow(g,.7);l1+=Math.abs(g-REC[i]);}return Math.max(.8,Math.round((3.2*s-3.0*l1)*10)/10);}
function fx1(v){return (Math.round(v*10)/10).toFixed(1).replace('.',',')+'x';}
function kpiBlock(f,T){var r=roasOf(f);return {r:r,acos:Math.round(100/r),ing:r*T*.8,ven:r*T};}

var drag04=null;
function mount04(){
  var T=S.G.total/1e6,MIN=Math.max(.1,Math.round(T*.05*10)/10),nm=cnames();
  if(!S.P){S.P={x:[Math.round(T*REC[0]*10)/10,Math.round(T*REC[1]*10)/10,0],moved:null};S.P.x[2]=Math.round((T-S.P.x[0]-S.P.x[1])*10)/10;}
  var plot=document.getElementById('plot'),axis=document.getElementById('axis');
  [0,.25,.5,.75,1].forEach(function(t){var v=T*t,lab=v===0?'$0':'$'+(Math.round(v*10)/10).toString().replace('.',',')+'M';
    var s=document.createElement('span');s.textContent=lab;s.style.top=(100-t*100)+'%';axis.appendChild(s);
    var g=document.createElement('div');g.className='gl';g.style.top=(100-t*100)+'%';plot.appendChild(g);});
  var els=[];
  for(var i=0;i<3;i++){(function(i){
    var col=document.createElement('div');col.className='col';col.style.left=(i*33.333)+'%';
    var ghost=document.createElement('div');ghost.className='ghost';ghost.style.top=(100-OLD[i]*100)+'%';
    var bar=document.createElement('div');bar.className='move';
    var c=document.createElement('div');c.className='dcard';c.tabIndex=0;c.setAttribute('role','slider');c.setAttribute('aria-label','Presupuesto de '+nm[i]);c.setAttribute('aria-valuemin',MIN);c.setAttribute('aria-valuemax',T-2*MIN);
    c.innerHTML='<span class="th" style="background:'+THC[i]+'"></span><span><span class="nm">'+esc(nm[i])+'</span><span class="am"></span><span class="dl"></span></span>';
    col.appendChild(bar);col.appendChild(ghost);col.appendChild(c);plot.appendChild(col);
    els.push({c:c,bar:bar,am:c.querySelector('.am'),dl:c.querySelector('.dl')});
    c.addEventListener('pointerdown',function(e){
      e.preventDefault();var r=c.getBoundingClientRect();drag04={i:i,off:e.clientY-(r.top+r.height/2)};c.classList.add('drag');
      try{c.setPointerCapture(e.pointerId);}catch(_){}
      c.onpointermove=function(ev){if(!drag04)return;var pr=plot.getBoundingClientRect();set04(drag04.i,(pr.bottom-(ev.clientY-drag04.off))/pr.height*T);};
      var end=function(){c.classList.remove('drag');c.onpointermove=null;c.onpointerup=null;c.onpointercancel=null;drag04=null;};
      c.onpointerup=end;c.onpointercancel=end;});
    c.addEventListener('keydown',function(e){var st=e.shiftKey?.5:.1;
      if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();set04(i,S.P.x[i]+st);}
      if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();set04(i,S.P.x[i]-st);}});
  })(i);}
  mount04.els=els;mount04.T=T;mount04.MIN=MIN;mount04.nm=nm;
  upd04();
}
function set04(i,v){
  var T=mount04.T,MIN=mount04.MIN,P=S.P;v=Math.round(clamp(v,MIN,T-2*MIN)*10)/10;
  var o=[0,1,2].filter(function(k){return k!==i;}),R=T-v,wa=REC[o[0]],wb=REC[o[1]];
  var a=Math.round(R*wa/(wa+wb)*10)/10;a=clamp(a,MIN,R-MIN);var b=Math.round((R-a)*10)/10;
  P.x[i]=v;P.x[o[0]]=a;P.x[o[1]]=b;P.moved=i;upd04();
}
A.resetP=function(){S.P=null;render(true);};
function upd04(){
  var els=mount04.els,T=mount04.T,nm=mount04.nm,P=S.P,f=P.x.map(function(x){return x/T;}),k=kpiBlock(f,T),rows='';
  for(var i=0;i<3;i++){
    var x=P.x[i],old=Math.round(OLD[i]*T*10)/10,d=Math.round((x-old)*10)/10,e=els[i],cl=d>0?'up':d<0?'down':'flat';
    e.c.style.top=(100-x/T*100)+'%';e.c.setAttribute('aria-valuenow',x);e.c.setAttribute('aria-valuetext',mm(x));
    e.am.textContent=mm(x);e.dl.className='dl '+cl;e.dl.textContent=dm(d);
    var hi=Math.max(x,old),lo=Math.min(x,old);e.bar.style.top=(100-hi/T*100)+'%';e.bar.style.height=((hi-lo)/T*100)+'%';e.bar.style.background=d>=0?'var(--green)':'var(--red)';e.bar.style.display=Math.abs(d)<.05?'none':'block';
    rows+='<div class="prow"><b>'+esc(nm[i])+'</b><span class="dl '+cl+'">'+dm(d)+'</span><span class="rg">de '+mm(old)+' a '+mm(x)+'</span></div>';
  }
  document.getElementById('prows').innerHTML=rows;
  document.getElementById('k_roas').textContent=fx1(k.r);document.getElementById('k_acos').textContent='ROAS neto · ACOS '+k.acos+'%';
  document.getElementById('r_roas').textContent=fx1(k.r);document.getElementById('r_ing').textContent=mm(k.ing);
  document.getElementById('r_note').textContent='ROAS neto descuenta promociones y comisión Rappi (supuesto 20%). Ventas brutas: '+mm(k.ven,0)+'. Tú apruebas antes de lanzar.';

 ['01','01 · Inicio - Cuenta empresa'],['01b','01b · Inicio con menú de perfil'],['02','02 · Crear campaña'],['02a','02a · Ada: Tu negocio'],['02b','02b · Ada: Tu producto'],['02c','02c · Ada: Tu objetivo'],['02d','02d · Ada: Tu público'],['02e','02e · Ada: Presupuesto y tiempos'],['02f','02f · Ada: Tus materiales'],['02g','02g · Ada: Cómo medir'],['02h','02h · Esto entendí'],
 ['03','03 · Elegir gestión'],['04','04 · Reparto con IA'],['04b','04b · Reparto manual'],['05','05 · Sugerencias de Ada'],['06','06 · Resultados · Ventas'],['06b','06b · Resultados · Visibilidad'],['07','07 · Mi perfil'],['08','08 · Notificaciones'],['09','09 · Tus campañas'],['10','10 · Ayuda']];
