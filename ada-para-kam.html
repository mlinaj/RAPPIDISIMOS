<style>
body{margin:0;background:#f5f5f5}
.hide{display:none!important}
#ak-top{background:#fff;border-bottom:4px solid #ff441f;display:flex;justify-content:space-between;align-items:center;padding:12px 32px;font-family:Poppins,system-ui,sans-serif}
#ak-top .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#1d1d1f;letter-spacing:-.01em}
#ak-top .logo i{width:38px;height:38px;border-radius:12px;background:#ff441f;color:#fff;font-style:normal;display:grid;place-items:center;font-size:22px}
#ak-top .logo em{color:#ff441f;font-style:normal;margin:0 3px}
#ak-top .who{font-weight:500;color:#1d1d1f}

  color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1240px;margin:0 auto;padding:18px 32px 60px}
#ada-kam *{box-sizing:border-box}

#ada-kam .note{color:var(--mute);font-size:13px}

#ak-nav{position:sticky;top:12px;background:#fff;border:1px solid #ececec;border-radius:24px;padding:12px;font-family:Poppins,system-ui,sans-serif}
#ak-nav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:16px;padding:12px 14px;font:inherit;font-weight:500;cursor:pointer;color:#1d1d1f}

#ak-drawer h2{margin:0 0 8px;font-size:20px}
#ak-drawer .ent{padding:10px 0;border-bottom:1px solid #f1f1f1;font-size:13.5px}
#ak-drawer .ent span{color:#6b6b6b;font-size:12px}
#ak-drawer button{font:inherit;cursor:pointer;border-radius:99px;border:0;background:#f0f0f0;padding:6px 14px}

<body>
<header id="ak-top"><div class="logo"><i>A</i><div>Ads<em>·</em>Planner</div></div><div style="display:flex;align-items:center;gap:14px"><button id="ak-bell" data-act="drawer" class="bellbtn">Registro <span id="ak-badge" class="badgeN hide">0</span></button><div class="who" id="ak-who">Vista KAM</div></div></header>
<div id="ada-kam">
  <div id="ak-banner"></div>
  <div class="shell"><nav id="ak-nav"></nav><main id="ak-view"></main></div>
</div>
<div id="ak-drawer" class="hide"></div>
<div id="ak-toasts"></div>
<script>
/* ===== Núcleo de Ada: lectura de columnas, análisis y recomendaciones (sin DOM) ===== */
const FIELDS = {
  promo: [
    { k: 'codigo', label: 'Código del producto Rappi', req: true, alias: ['codigo producto rappi', 'codigo del producto para rappi', 'codigo rappi', 'cod rappi', 'sku rappi', 'item', 'sku', 'codigo producto', 'codigo'] },
    { k: 'desc', label: 'Descripción', alias: ['descripcion de catalogo', 'descripcion catalogo', 'descripcion', 'producto', 'nombre'] },
    { k: 'mes', label: 'Mes de activación', req: true, alias: ['mes de activacion', 'mes activacion', 'activacion', 'mes', 'periodo'] },
    { k: 'pct', label: '% de descuento', req: true, alias: ['% de descuento', '% descuento', 'pct descuento', 'descuento'] },
    { k: 'pctMarca', label: '% descuento que paga la marca', alias: ['% de descuento que nosotros vamos a pagar', 'que nosotros vamos a pagar', 'vamos a pagar', 'paga la marca', 'nosotros'] },
    { k: 'pctRappi', label: '% descuento que paga Rappi', alias: ['% de descuento que ellos como empresa pagan', 'ellos como empresa pagan', 'empresa pagan', 'paga rappi', 'ellos'] },
    { k: 'tipoAd', label: 'Tipo de anuncio (opcional)', alias: ['tipo de anuncio', 'tipo anuncio', 'tipo ad', 'formato de anuncio', 'anuncio'] },
    { k: 'duracion', label: 'Duración en días (opcional)', alias: ['duracion dias', 'duracion en dias', 'duracion', 'dias'] },
    { k: 'marca', label: 'Marca o cliente (opcional)', exactOnly: true, alias: ['marca', 'cliente', 'proveedor', 'empresa', 'brand'] }
  ],
  ventas: [
    { k: 'codigo', label: 'Código del producto (item)', req: true, alias: ['item', 'codigo producto rappi', 'codigo rappi', 'sku rappi', 'codigo producto', 'codigo'] },
    { k: 'periodo', label: 'Periodo', req: true, alias: ['periodo', 'mes', 'fecha'] },
    { k: 'cant', label: 'Cantidad de unidades', req: true, alias: ['cantidad de unidades', 'cantidades', 'cantidad', 'unidades', 'unid'] },
    { k: 'kilos', label: 'Kilos vendidos (opcional)', alias: ['kilos vendidos', 'kilos', 'kg'] },
    { k: 'nns', label: 'NNS (opcional, ventas netas)', alias: ['nns', 'venta neta', 'ventas netas'] },
    { k: 'inversion', label: 'Inversión en Rappi Ads (opcional)', alias: ['inversion en rappi ads', 'inversion publicitaria', 'inversion', 'gasto en ads', 'gasto publicitario', 'gasto'] },
    { k: 'marca', label: 'Marca o cliente (opcional)', exactOnly: true, alias: ['marca', 'cliente', 'proveedor', 'empresa', 'brand'] }
  ]
};

const norm = (s) => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%]+/g, ' ').trim();

function detectMapping(kind, headers) {
  const fields = FIELDS[kind], nh = headers.map(norm), used = new Set(), map = {};
  // pasada 1: coincidencia exacta; pasada 2: el encabezado contiene el alias
  for (const pass of [1, 2]) {
    for (const f of fields) {
      if (map[f.k] != null || (pass === 2 && f.exactOnly)) continue;
      for (const a of f.alias) {
        const an = norm(a);
        const i = nh.findIndex((h, idx) => !used.has(idx) && h && (pass === 1 ? h === an : an.length >= 4 && h.includes(an)));
        if (i >= 0) { map[f.k] = headers[i]; used.add(i); break; }
      }
    }
  }
  return map;
}

const MESES = { enero: 1, ene: 1, febrero: 2, feb: 2, marzo: 3, mar: 3, abril: 4, abr: 4, mayo: 5, may: 5, junio: 6, jun: 6, julio: 7, jul: 7, agosto: 8, ago: 8, septiembre: 9, setiembre: 9, sep: 9, sept: 9, octubre: 10, oct: 10, noviembre: 11, nov: 11, diciembre: 12, dic: 12 };
const ym = (y, m) => (m >= 1 && m <= 12 && y >= 1990 && y <= 2100) ? y + '-' + String(m).padStart(2, '0') : null;

function toPeriod(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return ym(v.getUTCFullYear(), v.getUTCMonth() + 1);
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return ym(d.getUTCFullYear(), d.getUTCMonth() + 1); }
    if (v >= 199001 && v <= 209912) return ym(Math.floor(v / 100), v % 100);
    return null;
  }
  const s = norm(v).replace(/ /g, '-'); let m;
  const raw = String(v).trim().toLowerCase();
  if ((m = raw.match(/^(\d{4})[-\/.](\d{1,2})/))) return ym(+m[1], +m[2]);
  if ((m = raw.match(/^(\d{1,2})[-\/.](\d{4})$/))) return ym(+m[2], +m[1]);
  if ((m = raw.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return ym(+m[3], +m[2]); // dd/mm/aaaa
  if ((m = raw.match(/^(\d{4})(\d{2})$/))) return ym(+m[1], +m[2]);
  if ((m = s.match(/^([a-z]+)-?(\d{2,4})$/)) && MESES[m[1]]) { const y = +m[2] < 100 ? 2000 + +m[2] : +m[2]; return ym(y, MESES[m[1]]); }
  return null;
}

function parseNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[%\s$]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : null;
}
function toPct(v) {
  const n = parseNum(v); if (n == null) return null;
  const hasSign = typeof v === 'string' && v.includes('%');
  const p = (!hasSign && n <= 1) ? n * 100 : n;
  return (p >= 0 && p <= 100) ? p : null;
}

const band = (p) => p <= 10 ? 'Hasta 10%' : p <= 20 ? '11–20%' : p <= 30 ? '21–30%' : 'Más de 30%';
const BANDS = ['Hasta 10%', '11–20%', '21–30%', 'Más de 30%'];
const durBand = (d) => d <= 7 ? 'Hasta 7 días' : d <= 14 ? '8–14 días' : 'Más de 14 días';
const DURS = ['Hasta 7 días', '8–14 días', 'Más de 14 días'];
const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const K_SHRINK = 3;

function analyze(promoRows, ventasRows, mp, mv) {
  const warn = [];
  // --- promociones
  let badPromo = 0;
  const promoMap = new Map();
  for (const r of promoRows) {
    const cod = String(r[mp.codigo] ?? '').trim(), per = toPeriod(r[mp.mes]), pct = toPct(r[mp.pct]);
    if (!cod || !per || pct == null) { badPromo++; continue; }
    if (pct <= 0) continue; // sin descuento: no es promoción
    const key = cod + '|' + per, prev = promoMap.get(key);
    if (!prev || pct > prev.pct) promoMap.set(key, {
      cod, per, pct, desc: mp.desc ? String(r[mp.desc] ?? '') : '',
      tipo: mp.tipoAd && r[mp.tipoAd] ? String(r[mp.tipoAd]).trim() : null,
      dur: mp.duracion ? parseNum(r[mp.duracion]) : null,
      pm: mp.pctMarca ? toPct(r[mp.pctMarca]) : null
    });
  }
  if (badPromo) warn.push(`${badPromo} filas de promociones se ignoraron (código, mes o % de descuento ilegible).`);
  // --- ventas
  let badVent = 0;
  const sales = new Map();
  for (const r of ventasRows) {
    const cod = String(r[mv.codigo] ?? '').trim(), per = toPeriod(r[mv.periodo]), u = parseNum(r[mv.cant]);
    if (!cod || !per || u == null) { badVent++; continue; }
    const key = cod + '|' + per;
    const s = sales.get(key) || { cod, per, u: 0, n: 0, hasN: false, k: 0, inv: 0, hasI: false };
    if (mv.inversion) { const iv = parseNum(r[mv.inversion]); if (iv != null) { s.inv += iv; s.hasI = true; } }
    s.u += u; if (mv.kilos) s.k += parseNum(r[mv.kilos]) || 0;
    if (mv.nns) { const n = parseNum(r[mv.nns]); if (n != null) { s.n += n; s.hasN = true; } }
    sales.set(key, s);
  }
  if (badVent) warn.push(`${badVent} filas de ventas se ignoraron (código, periodo o cantidad ilegible).`);
  const useNNS = !!mv.nns && [...sales.values()].some(s => s.hasN);
  const metric = (s) => useNNS ? s.n : s.u;
  if (mv.nns && !useNNS) warn.push('La columna NNS no tiene valores numéricos: el análisis usa unidades.');
  if (!mv.nns) warn.push('Sin columna NNS: las recomendaciones se calculan sobre unidades vendidas, no sobre ventas netas.');

  // --- línea base por producto (meses sin promoción)
  const byProd = new Map();
  for (const s of sales.values()) { if (!byProd.has(s.cod)) byProd.set(s.cod, []); byProd.get(s.cod).push(s); }
  const base = new Map();
  for (const [cod, arr] of byProd) {
    const nb = arr.filter(s => !promoMap.has(s.cod + '|' + s.per) && s.u > 0);
    if (nb.length >= 2) base.set(cod, { u: mean(nb.map(s => s.u)), m: mean(nb.map(metric)), n: nb.length });
  }
  // --- estacionalidad mensual (con encogimiento hacia 1)
  const acc = {};
  for (const [cod, arr] of byProd) {
    const b = base.get(cod); if (!b || !b.u) continue;
    for (const s of arr) if (!promoMap.has(s.cod + '|' + s.per) && s.u > 0) {
      const mth = +s.per.slice(5); (acc[mth] = acc[mth] || []).push(s.u / b.u);
    }
  }
  const seas = {}; let tot = 0, cnt = 0;
  for (let m = 1; m <= 12; m++) { const a = acc[m] || []; seas[m] = (a.reduce((x, y) => x + y, 0) + 2) / (a.length + 2); tot += seas[m]; cnt++; }
  for (let m = 1; m <= 12; m++) seas[m] = seas[m] / (tot / cnt);

  // --- observaciones de promoción (alza vs. lo esperable ese mes sin promo)
  const obs = [];
  for (const p of promoMap.values()) {
    const s = sales.get(p.cod + '|' + p.per), b = base.get(p.cod);
    if (!s || !b || !b.u || !b.m) continue;
    const mth = +p.per.slice(5), sf = seas[mth] || 1;
    const upU = s.u / (b.u * sf) - 1;
    const up = useNNS ? (s.hasN ? s.n / (b.m * sf) - 1 : null) : upU;
    if (up == null) continue;
    obs.push({ cod: p.cod, desc: p.desc, per: p.per, pct: p.pct, band: band(p.pct), tipo: p.tipo, dur: p.dur, durBand: p.dur != null ? durBand(p.dur) : null, upU, up, pm: p.pm });
  }
  if (!obs.length) throw new Error('No se pudo cruzar ninguna promoción con ventas. Revisa que los códigos y los meses coincidan entre ambos archivos, y que cada producto tenga al menos 2 meses sin promoción.');

  const groupStats = (arr, keyFn, order) => {
    const g = {}; for (const o of arr) { const k = keyFn(o); if (k == null) continue; (g[k] = g[k] || []).push(o); }
    const keys = order ? order.filter(k => g[k]) : Object.keys(g);
    return keys.map(k => ({ key: k, n: g[k].length, up: mean(g[k].map(o => o.up)), upU: mean(g[k].map(o => o.upU)) }));
  };
  const global = {
    band: groupStats(obs, o => o.band, BANDS),
    tipo: groupStats(obs, o => o.tipo),
    dur: groupStats(obs, o => o.durBand, DURS)
  };
  const gmean = (list, key) => (list.find(x => x.key === key) || {}).up;

  // mejor grupo para un producto, con encogimiento hacia el promedio global
  function best(prodObs, keyFn, globalList) {
    const cand = globalList.filter(g => g.n >= 2);
    if (!cand.length) return null;
    const rows = cand.map(g => {
      const mine = prodObs.filter(o => keyFn(o) === g.key);
      const score = (mine.reduce((s, o) => s + o.up, 0) + K_SHRINK * g.up) / (mine.length + K_SHRINK);
      return { key: g.key, nMine: mine.length, score, own: mine.length ? mean(mine.map(o => o.up)) : null, glob: g.up };
    }).sort((a, b) => b.score - a.score);
    return { top: rows[0], rows };
  }

  const products = [];
  for (const cod of base.keys()) {
    const po = obs.filter(o => o.cod === cod);
    const bb = best(po, o => o.band, global.band);
    if (!bb) continue;
    const bt = global.tipo.length ? best(po, o => o.tipo, global.tipo) : null;
    const bd = global.dur.length ? best(po, o => o.durBand, global.dur) : null;
    const desc = (po.find(o => o.desc) || {}).desc || (promoRows.find(r => String(r[mp.codigo] ?? '').trim() === cod && mp.desc) || {})[mp.desc] || '';
    const conf = po.length >= 4 ? 'Alta' : po.length >= 2 ? 'Media' : 'Baja';
    products.push({ cod, desc: desc || cod, nPromos: po.length, conf, band: bb, tipo: bt, dur: bd, obs: po, baseU: base.get(cod).u });
  }
  products.sort((a, b) => b.band.top.score - a.band.top.score);

  // --- marcas, tendencias y tipo de cliente
  const prodBrand = new Map();
  const fillBrand = (rows, m) => { if (!m.marca) return; for (const r of rows) { const c = String(r[m.codigo] ?? '').trim(), b = String(r[m.marca] ?? '').trim(); if (c && b && !prodBrand.has(c)) prodBrand.set(c, b); } };
  fillBrand(ventasRows, mv); fillBrand(promoRows, mp);
  const brandOf = (c) => prodBrand.get(c) || 'Todas las marcas';
  const periods = [...new Set([...sales.values()].map(s => s.per))].sort();
  const lastPer = periods[periods.length - 1];
  const last3 = periods.slice(-3), prev3 = periods.slice(-6, -3);
  const adj = (s) => metric(s) / (seas[+s.per.slice(5)] || 1);
  const normalMean = (cod, pers) => { const a = (byProd.get(cod) || []).filter(s => pers.includes(s.per) && !promoMap.has(s.cod + '|' + s.per)).map(adj); return a.length ? mean(a) : null; };
  const trendOf = (cod) => { if (prev3.length < 3) return null; const l = normalMean(cod, last3), p = normalMean(cod, prev3); return (l != null && p) ? { t: l / p - 1, l, p } : null; };
  for (const p of products) {
    const tr = trendOf(p.cod); p.trend = tr ? tr.t : null; p.brand = brandOf(p.cod);
    p.promoRecent = last3.some(per => promoMap.has(p.cod + '|' + per));
    const mine = [...promoMap.values()].filter(x => x.cod === p.cod).map(x => x.per).sort(); p.lastPromo = mine.length ? mine[mine.length - 1] : null;
  }
  const brandNames = [...new Set([...byProd.keys()].map(brandOf))];
  const brands = brandNames.map(name => {
    const codes = [...byProd.keys()].filter(c => brandOf(c) === name);
    const series = periods.map(per => { let v = 0, pc = 0, iv = 0; for (const c of codes) { const s = sales.get(c + '|' + per); if (s) { v += metric(s); iv += s.inv; if (promoMap.has(c + '|' + per)) pc++; } } return { per, v, promos: pc, inv: iv }; });
    let tot = 0, inPromo = 0;
    for (const c of codes) for (const s of byProd.get(c)) { tot += metric(s); if (promoMap.has(s.cod + '|' + s.per)) inPromo += metric(s); }
    let L = 0, Pv = 0, nT = 0;
    for (const c of codes) { const tr = trendOf(c); if (tr) { L += tr.l; Pv += tr.p; nT++; } }
    const ob = obs.filter(o => brandOf(o.cod) === name);
    const sum = (arr, k, pers) => arr.filter(x => pers.includes(x.per)).reduce((a, x) => a + x[k], 0);
    const invTot = series.reduce((a, x) => a + x.inv, 0), hasInv = invTot > 0;
    let vInv = 0; for (const c of codes) for (const s of byProd.get(c)) if (s.inv > 0) vInv += metric(s);
    const roas = (hasInv && useNNS) ? vInv / invTot : null;
    const iL = sum(series, 'inv', last3), iP = sum(series, 'inv', prev3), sL = sum(series, 'v', last3), sP = sum(series, 'v', prev3);
    const promoted = codes.filter(c => [...promoMap.keys()].some(k => k.startsWith(c + '|'))).length;
    return { name, codes, series, hasInv, roas, invGrowth: (hasInv && iP > 0) ? iL / iP - 1 : null, salesGrowth: sP > 0 ? sL / sP - 1 : null, invShare: (hasInv && sL > 0) ? iL / sL : null, promoted, nPromoMonths: series.filter(x => x.promos > 0).length, promoLast3: series.slice(-3).filter(x => x.promos > 0).length, total: tot, promoShare: tot ? inPromo / tot : 0, trend: (nT && Pv) ? L / Pv - 1 : null, avgUp: ob.length ? mean(ob.map(o => o.up)) : null, obs: ob, nProducts: codes.length, tier: null };
  }).sort((a, b) => b.total - a.total);
  if (brands.length >= 3) brands.forEach((b, i) => { b.tier = i < Math.ceil(brands.length * 0.2) ? 1 : i < Math.ceil(brands.length * 0.5) ? 2 : 3; });
  const nm = (lastPer ? (+lastPer.slice(5) % 12) + 1 : 1);
  const planning = { month: nm, idx: seas[nm] || 1 };
  if (!prev3.length || prev3.length < 3) warn.push('Hay menos de 6 meses de ventas: Ada no puede calcular tendencias de los últimos 3 meses.');

  return {
    warn, useNNS, obs, global, seas, products, brands, planning, lastPer, periods,
    nProductos: base.size, nPromos: obs.length,
    medianUp: (() => { const a = obs.map(o => o.up).sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; })(),
    gmean
  };
}

/* ===== Señales estimadas (reglas simples, no datos duros) ===== */
function riskOf(b) {
  let p = 0; const why = [];
  if (b.trend != null && b.trend <= -0.10) { p += 30; why.push('sus ventas normales caen ' + Math.round(-b.trend * 100) + '%'); } else if (b.trend != null && b.trend <= -0.05) { p += 15; why.push('sus ventas normales caen levemente'); }
  if (b.promoLast3 === 0) { p += 25; why.push('no ha hecho campañas en los últimos 3 meses'); } else if (b.promoLast3 === 1) { p += 10; why.push('solo hizo campaña 1 de los últimos 3 meses'); }
  if (b.roas != null && b.roas < 2) { p += 20; why.push('su retorno por $1 invertido es bajo (' + b.roas.toFixed(1).replace('.', ',') + 'x)'); } else if (b.roas != null && b.roas < 3) { p += 10; why.push('su retorno por $1 es moderado (' + b.roas.toFixed(1).replace('.', ',') + 'x)'); }
  if (b.invGrowth != null && b.invGrowth <= -0.30) { p += 25; why.push('su inversión bajó ' + Math.round(-b.invGrowth * 100) + '%'); }
  p = Math.min(100, p);
  return { score: p, level: p >= 60 ? 'Alto' : p >= 30 ? 'Medio' : 'Bajo', why: why.length ? why : ['sin señales de alerta en los datos'] };
}
function oppOf(b, res) {
  let p = 0; const why = [];
  const unprom = b.nProducts ? 1 - b.promoted / b.nProducts : 0;
  if (unprom >= 0.3) { p += Math.round(unprom * 30); why.push(Math.round(unprom * 100) + '% de sus productos nunca ha tenido promoción'); }
  if (b.trend != null && b.trend >= 0.05) { p += 25; why.push('sus ventas normales crecen ' + Math.round(b.trend * 100) + '%'); }
  if (res.planning.idx >= 1.05) { p += 20; why.push('el próximo mes suele ser de alta demanda'); }
  if (b.avgUp != null && b.avgUp >= 0.30) { p += 25; why.push('sus promociones suben las ventas ' + Math.round(b.avgUp * 100) + '% en promedio'); }
  p = Math.min(100, p);
  return { score: p, level: p >= 60 ? 'Alta' : p >= 30 ? 'Media' : 'Baja', why: why.length ? why : ['sin señales claras de crecimiento en los datos'] };
}

/* ===== Acciones sugeridas al KAM para una marca ===== */
const MESN = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pf = (x) => x == null ? '–' : (x >= 0 ? '+' : '') + Math.round(x * 100) + '%';
const perL = (p) => MESN[+p.slice(5) - 1] + ' ' + p.slice(0, 4);

function actionsFor(res, brand, tier) {
  const A = [], prods = res.products.filter(p => p.brand === brand.name), uN = res.useNNS ? 'ventas netas' : 'unidades';
  const sugg = (p) => p.band.top.key + (p.tipo ? ' · ' + p.tipo.top.key : '') + (p.dur ? ' · ' + p.dur.top.key : '');
  // 1. productos en caída sin promoción reciente
  const fall = prods.filter(p => p.trend != null && p.trend <= -0.10 && !p.promoRecent).sort((a, b) => a.trend - b.trend);
  if (fall.length) A.push({ kind: 'caida', prio: fall.length >= 3 ? 1 : 2, title: `Reactivar ${fall.length} producto${fall.length > 1 ? 's' : ''} en caída`,
    why: 'Sus ventas normales (sin promoción) bajaron en los últimos 3 meses y no tienen promoción reciente.',
    how: 'Programa una promoción con la sugerencia de cada producto. Recuerda reservar el espacio con 15 días de anticipación.',
    items: fall.slice(0, 6).map(p => `${p.desc}: ${pf(p.trend)} · sugerencia ${sugg(p)} (alza esperada ${pf(p.band.top.score)}, confianza ${p.conf.toLowerCase()})`) });
  // 2. descuentos que no se pagaron solos
  const bad = [...brand.obs].filter(o => o.up < 0).sort((a, b) => a.up - b.up);
  if (bad.length) A.push({ kind: 'bajo', prio: bad.length >= 2 ? 1 : 2, title: bad.length > 1 ? 'Descuentos que no se pagaron solos' : 'Un descuento que no se pagó solo',
    why: res.useNNS ? 'En estos casos el descuento no compensó: las ventas netas quedaron bajo lo esperable sin promoción.' : 'En estos casos la promoción no logró subir las ventas.',
    how: 'La próxima vez usa un tramo menor o combínalo con un anuncio sin descuento.',
    items: bad.slice(0, 5).map(o => { const p = prods.find(x => x.cod === o.cod); return `${(p && p.desc) || o.cod}: ${Math.round(o.pct)}% en ${perL(o.per)} → unidades ${pf(o.upU)}, ${uN} ${pf(o.up)} vs. lo esperado`; }) });
  // 3. temporada
  const idx = res.planning.idx, mes = MESN[res.planning.month - 1];
  if (idx >= 1.05) A.push({ kind: 'temporada', prio: 1, title: `Se viene ${mes}: demanda más alta de lo normal`, why: `Históricamente ${mes} vende ${pf(idx - 1)} sobre un mes promedio.`,
    how: 'Reserva espacio publicitario ahora (15 días de anticipación y aprobación del Country Manager) y prioriza los productos de mayor volumen.', items: [] });
  else if (idx <= 0.95) A.push({ kind: 'temporada', prio: 3, title: `${mes[0].toUpperCase() + mes.slice(1)} suele ser un mes más flojo`, why: `Históricamente ${mes} vende ${pf(idx - 1)} bajo un mes promedio.`,
    how: 'Buen momento para promociones que activen la demanda de los productos en caída.', items: [] });
  // 4. dependencia de promociones
  if (brand.promoShare >= 0.5) A.push({ kind: 'dep', prio: 2, title: 'La marca depende mucho de las promociones', why: `${Math.round(brand.promoShare * 100)}% de sus ventas ocurre en meses con promoción.`,
    how: 'Alterna promociones con anuncios sin descuento (banner o video) para sostener la demanda sin regalar margen.', items: [] });
  // 5. productos que ya crecen
  const up = prods.filter(p => p.trend != null && p.trend >= 0.10 && !p.promoRecent).sort((a, b) => b.baseU - a.baseU).slice(0, 3);
  if (up.length) A.push({ kind: 'crece', prio: 3, title: 'Cuida el margen en productos que ya crecen', why: 'Suben sin necesitar promoción reciente.',
    how: 'No los descuentes. Si quieres empujarlos, usa un anuncio sin descuento.', items: up.map(p => `${p.desc}: ${pf(p.trend)} en ventas normales`) });
  // 6. servicio publicitario según tipo de cliente
  const bt = res.global.tipo.filter(g => g.n >= 3).sort((a, b) => b.up - a.up)[0];
  const dataLine = bt ? `En los datos, el anuncio con mayor alza promedio fue “${bt.key}” (${pf(bt.up)}).` : null;
  let sv;
  if (tier === 3) sv = { t: 'Autoservicio guiado por Ada', d: 'Banner simple más una promoción en el tramo sugerido. Evita formatos con requisitos exigentes.' };
  else if (tier === 2) sv = { t: 'Banner + video corto', d: 'Video de hasta 15 s y 10 MB, y revisión mensual de resultados con el cliente.' };
  else if (tier === 1) { const n = brand.nProducts; sv = { t: n >= 20 ? 'Dynamic Landing + dashboard' : 'Video + dashboard (Dynamic Landing aún no aplica)', d: `Dynamic Landing exige mínimo 20 productos con 20% de descuento: la marca tiene ${n} productos en tus archivos. Ofrece dashboard y estudios, que tienen 2 a 5 semanas de espera: pídelos con tiempo.` }; }
  else sv = { t: 'Define el tipo de cliente', d: 'Con menos de 3 marcas en tus archivos Ada no puede clasificarlas. Elige el tipo arriba para recibir el servicio sugerido.' };
  A.push({ kind: 'servicio', prio: 2, title: 'Servicio publicitario sugerido: ' + sv.t, why: tier ? `Cliente ${tier === 1 ? 'tier 1' : tier === 2 ? 'tier 2' : 'longtail'}.` : '', how: sv.d + (dataLine ? ' ' + dataLine : ''), items: [] });
  // 7. datos insuficientes
  const noHist = brand.nProducts - prods.length;
  if (noHist > 0) A.push({ kind: 'datos', prio: 3, title: `${noHist} producto${noHist > 1 ? 's' : ''} sin historial suficiente`, why: 'Necesitan al menos 2 meses sin promoción para poder comparar.', how: 'Ada no recomienda sobre ellos hasta tener más datos.', items: [] });
  return A.sort((a, b) => a.prio - b.prio);
}

/* ===== Datos de ejemplo FICTICIOS con la misma estructura que los Excel descritos ===== */
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function makeSample() {
  const r = mulberry(20261111);
  const gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const periods = []; for (let i = 0; i < 12; i++) { const y = 2025 + Math.floor((10 + i) / 12), m = ((10 + i) % 12) + 1; periods.push({ y, m, p: ym(y, m) }); }
  const seasT = { 1: .92, 2: .88, 3: 1, 4: 1, 5: 1, 6: .97, 7: 1.05, 8: 1, 9: 1.02, 10: 1.05, 11: 1.1, 12: 1.22 };

    case 'step': state.step = t.dataset.n === 'g' ? 'g' : +t.dataset.n; render(); return window.scrollTo({ top: 0 });
    case 'next': state.step = Math.min(6, (+state.step || 3) + 1); render(); return window.scrollTo({ top: 0 });
    case 'done': { const s = Object.assign({}, c.steps), k = 's' + state.step; s[k] = !s[k]; store.saveClient(c.id, { steps: s }); store.addLog(c.id, (s[k] ? 'marcó como listo' : 'reabrió') + ' el paso ' + state.step + ' «' + STEPS[state.step - 1].t + '»'); return go(); }
    case 'tpl': return saveFile('Ada-plantilla-estandar.xlsx', stdTemplate());
    case 'tplCopy': return copy(STD.promo.map(x => x[0]).join('\t') + '\n' + STD.ventas.map(x => x[0]).join('\t'), t);
    case 'sampleGo': return useSample();
    case 'run': return run();
    case 'saveAll': state.res.brands.forEach(saveBrand); saveLearnings(); state.view = 'clientes'; return render();
    case 'saveDiag': { const lb = liveBrand(c.meta.name); if (lb) { saveBrand(lb); saveLearnings(); } return go(); }
    case 'rmSamples': Object.values(state.clients).filter(x => x.meta && x.meta.sample).forEach(x => store.removeClient(x.id)); return go();
    case 'newClient': { const el = $('nn'), name = (el.value || '').trim(); if (!name) { el.focus(); return; } const id = slug(name); if (!state.clients[id]) { store.saveClient(id, { meta: { name, tier: 0, since: '', createdAt: Date.now(), owner: state.uid }, steps: {} }); store.addLog(id, 'creó el cliente'); } state.newName = ''; return openClient(id); }
    case 'takeOwner': setSec(c, 'meta', { owner: state.uid }); store.addLog(c.id, 'quedó como responsable del cliente'); return go();
    case 'saveWeights': { const w = {}; document.querySelectorAll('[data-w]').forEach(i => { w[i.dataset.w] = Math.max(0, Math.min(100, +i.value || 0)); }); store.saveSetting('benchmark', { weights: w }); store.addLog(c.id, 'cambió la escala del benchmark (paso 2)'); return go(); }
    case 'dec': {
      const k = t.dataset.k, dd = Object.assign({}, sec(c, 'dec')), d = diagOf(c), ac = d && (d.actions || []).find(x => decKey(x) === k);
      dd[k] = Object.assign({}, dd[k], { est: t.dataset.v, by: state.uid, at: Date.now() }); store.saveClient(c.id, { dec: dd });
      store.addLog(c.id, 'decidió (paso 1) «' + (DEC_L[t.dataset.v] || '').toLowerCase() + '»' + (ac ? ': ' + ac.title : '')); return go();
    }
    case 'genMsg': setSec(c, 'inv', { mensaje: inviteMsg(c), canal: 'Correo' }); return go();
    case 'adaMsg': { const d = diagOf(c), inv = sec(c, 'inv'), link = userCfg().agenda || ''; const ta = document.querySelector('[data-f="inv.mensaje"]'); const p = `Redacta en español un correo breve, cordial y profesional (máximo 120 palabras, con línea "Asunto:") del KAM de Rappi Ads ${state.names[state.uid] || ''} para invitar al cliente ${c.meta.name}${inv.contacto ? ' (contacto: ' + inv.contacto + ')' : ''} al Rappi Club, una sesión de trabajo de ${cfg().sesion} minutos para diseñar juntos su próxima campaña${inv.fecha ? ', propuesta para el ' + inv.fecha + (inv.hora ? ' a las ' + inv.hora : '') : ''}. Cierra con la frase exacta "Agenda el horario que mejor te acomode aquí: ${link || '[link para agendar]'}". Oportunidad de crecimiento estimada: ${d ? d.opp.level : 'sin dato'}. No menciones cifras de ventas ni datos del cliente. No inventes datos. Entrega solo el correo.`; return adaTo(p, ta, t, (txt) => { setSec(c, 'inv', { mensaje: txt, canal: 'Correo' }); }); }
    case 'copyMsg': return copy(sec(c, 'inv').mensaje || inviteMsg(c), t);
    case 'sent': { const inv = sec(c, 'inv'); setSec(c, 'inv', { canal: 'Correo', estado: (inv.estado === 'aceptada' || inv.estado === 'rechazada') ? inv.estado : 'enviada', sentAt: Date.now(), sentBy: state.uid }); store.addLog(c.id, 'marcó la invitación como enviada por correo'); return go(); }
    case 'accept': setSec(c, 'inv', { estado: 'aceptada', acceptedAt: Date.now() }); store.addLog(c.id, 'registró que el cliente aceptó la invitación: se desbloquearon los pasos 4 a 6'); state.step = 4; return go();
    case 'reject': setSec(c, 'inv', { estado: 'rechazada' }); store.addLog(c.id, 'registró que el cliente rechazó la invitación'); return go();
    case 'reopenInv': setSec(c, 'inv', { estado: 'enviada' }); store.addLog(c.id, 'volvió la invitación a «Enviada»'); state.step = 'g'; return go();
    case 'addLink': { const u = $('lu').value.trim(), n = $('ln').value.trim(); if (!u && !n) return; setSec(c, 'dat', { links: (sec(c, 'dat').links || []).concat([{ tipo: $('lt').value, url: u, nota: n }]) }); logEdit(c.id, 'dat'); return go(); }
    case 'delLink': { const l = (sec(c, 'dat').links || []).slice(); l.splice(+t.dataset.i, 1); setSec(c, 'dat', { links: l }); return go(); }
    case 'addCamp': { const dsc = $('cd').value.trim(); if (!dsc) { $('cd').focus(); return; } const x = { desc: dsc, tipo: $('ct').value.trim(), pct: $('cp').value === '' ? null : +$('cp').value, dur: $('cdu').value === '' ? null : +$('cdu').value, mes: $('cm').value.trim() }; setSec(c, 'fic', { camps: (sec(c, 'fic').camps || []).concat([x]) }); store.addLog(c.id, 'agregó la campaña «' + dsc + '» (paso 5.2)'); return go(); }
    case 'delCamp': { const l = (sec(c, 'fic').camps || []).slice(); l.splice(+t.dataset.i, 1); setSec(c, 'fic', { camps: l }); return go(); }
    case 'useObj': setSec(c, 'fic', { objetivoAcordado: objetivoSugerido(c, diagOf(c)) }); return go();
    case 'objFromCamps': { const fic = sec(c, 'fic'), dat = sec(c, 'dat'), cp = fic.camps || []; const txt = `Para ${c.meta.name}: ${dat.objTipo ? dat.objTipo.toLowerCase() + (dat.meta ? ' (meta ' + dat.meta + (dat.plazo ? ' en ' + dat.plazo + ' meses' : '') + ')' : '') + ' mediante ' : ''}${cp.length} campaña${cp.length > 1 ? 's' : ''}: ${cp.map(x => x.desc + (x.pct != null ? ' con ' + x.pct + '% de descuento' : '') + (x.dur ? ' por ' + x.dur + ' días' : '') + (x.mes ? ' en ' + x.mes : '')).join('; ')}.`; setSec(c, 'fic', { objetivoAcordado: txt }); return go(); }
    case 'pickM': setSec(c, 'fic', { metodologia: t.dataset.k, metManual: true }); store.addLog(c.id, 'eligió la metodología «' + METODOS.find(m => m.k === t.dataset.k).t + '» (paso 5.4)'); return go();
    case 'resetM': setSec(c, 'fic', { metManual: false }); return go();
    case 'saveTeam': { const nm = $('teamname').value.trim(); if (!nm) { $('teamname').focus(); return; } const caso = sec(c, 'caso'), cur = teams().filter(x => x.name !== nm); store.saveSetting('teams', { list: cur.concat([{ id: slug(nm), name: nm, kam: caso.eq_kam || '', guia: caso.eq_guia || '', inhouse: caso.eq_inhouse || '', externos: caso.eq_externos || '', actuario: caso.eq_actuario || '' }]) }); return go(); }
    case 'delTeam': store.saveSetting('teams', { list: teams().filter(x => x.id !== t.dataset.id) }); return go();
    case 'approve': { const s = Object.assign({}, c.steps, { s6: true }); store.saveClient(c.id, { caso: Object.assign({}, c.caso, { metodologia: metodoEff(c), objetivo: sec(c, 'fic').objetivoAcordado, aprobado: { by: state.uid, at: Date.now() } }), steps: s }); store.addLog(c.id, 'aprobó la ficha del caso'); return go(); }
    case 'unapprove': setSec(c, 'caso', { aprobado: null }); store.addLog(c.id, 'quitó la aprobación de la ficha del caso'); return go();
    case 'adaResumen': { const d = diagOf(c); return ada('Reescribe en español simple y cercano, en máximo 90 palabras y sin listas, este resumen de un cliente para un KAM. No cambies ni inventes cifras:\n\n' + summaryText(c, d), $('ada'), t); }
    case 'setBase': { const cc = C(t.dataset.id), d = diagOf(cc); if (!d) return; setSec(cc, 'dat', { base: { l3: d.l3, at: Date.now() } }); store.addLog(cc.id, 'fijó la base de ventas para su meta (KPIs)'); return go(); }
    case 'mine': state.onlyMine = t.checked; return go();
    case 'drawer': state.drawer = !state.drawer; state.unseen = 0; state.dfilter = 'all'; return render();
    case 'drawerClient': state.drawer = true; state.unseen = 0; state.dfilter = state.cid; return render();
    case 'drawerClose': if (e.target === t || t.tagName === 'BUTTON') { state.drawer = false; render(); } return;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'ak-files') { if (el.files.length) readFiles([...el.files]); return; }
  if (el.dataset.kind) { state.map[el.dataset.kind][el.dataset.k] = el.value || undefined; return render(); }
  if (el.id === 'ak-nn') { state.newName = el.value; return; }
  if (el.id === 'ak-dfilter') { state.dfilter = el.value; return renderDrawer(); }
  if (el.id === 'ak-teamsel') { const tm = teams().find(x => x.id === el.value); if (tm) { applyTeam(C(state.cid), tm); render(); } return; }
  if (el.dataset.uc) { store.saveSetting('user_' + state.uid, Object.assign({}, userCfg(), { [el.dataset.uc]: el.value.trim() })); return; }
  if (el.dataset.cf) { const k = el.dataset.cf, v = el.type === 'number' ? Math.max(1, +el.value || DEF_CFG[k]) : el.value; store.saveSetting('config', Object.assign({}, state.sd.config, { [k]: v })); if (state.cid) store.addLog(state.cid, 'cambió un ajuste del equipo: ' + (k === 'formula' ? 'fórmula de Angélica' : 'tiempo de ' + (k === 'sesion' ? 'la sesión' : METODOS.find(m => m.k === k).t))); return; }
  if (el.dataset.dk) { const c = C(state.cid), dd = Object.assign({}, sec(c, 'dec')); dd[el.dataset.dk] = Object.assign({}, dd[el.dataset.dk], { nota: el.value, by: state.uid, at: Date.now() }); store.saveClient(c.id, { dec: dd }); logEdit(c.id, 'dec'); const w = el.nextElementSibling; if (w && w.classList.contains('warn') && el.value) w.remove(); return; }
  const f = el.dataset.f; if (!f) return;
  const [s, k] = f.split('.'), cid = el.dataset.cid || state.cid, c = C(cid);
  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? null : +el.value) : el.value;
  if (s === 'meta' && k === 'tier') v = +el.value;
  setSec(c, s, { [k]: v });
  if (s === 'meta' && k === 'tier') { store.addLog(c.id, 'definió el tipo de cliente: ' + (v ? TIERS_L[v] : 'automático')); return render(); }
  if (s === 'dat' && k === 'alineacion') store.addLog(c.id, 'definió la alineación con Rappi Ads: ' + (v || 'sin definir') + ' (paso 2)');
  else logEdit(c.id, s);
  if (s === 'inv' && k === 'estado') return render();
  if (s === 'caso') { const ap = $('appr'); if (ap) ap.innerHTML = approvalHtml(C(state.cid)); }
  if (s === 'dat' && (k === 'meta' || k === 'plazo')) { const vd = $('verdict'); if (vd) vd.innerHTML = verdict(C(state.cid), diagOf(C(state.cid))); return; }
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || s === 'kpi') return render();
  if (s === 'meta' && k === 'since') state.pending = true;
});
document.addEventListener('focusout', () => { if (state.pending) setTimeout(() => { if (state.pending && !typing()) render(); }, 0); });
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('#ak-drop'); if (z) { e.preventDefault(); z.classList.add('on'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('#ak-drop'); if (z) z.classList.remove('on'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('#ak-drop'); if (z) { e.preventDefault(); z.classList.remove('on'); if (e.dataTransfer.files.length) readFiles([...e.dataTransfer.files]); } });

render();
store.init();
})();
</script>
<script>
/* Integración con RappiAds Planner: muestra el correo del KAM y, si va dentro del Planner, el botón de cerrar sesión */
(function(){
  var w=document.getElementById('ak-who'); if(!w)return;
  try{var em=new URLSearchParams(location.search).get('kam'); if(em)w.textContent=em;}catch(e){}
  if(window.parent!==window){
    var b=document.createElement('button'); b.className='bellbtn'; b.id='ak-logout'; b.textContent='Cerrar sesión';
    b.onclick=function(){parent.postMessage({type:'rappi-logout'},'*');};
    w.parentNode.appendChild(b);
  }
})();
</script>
