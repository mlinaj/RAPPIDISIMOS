s=\"root\" data-canvas-width=\"1440\" data-canvas-height=\"1100\" data-document-role=\"page\" data-label=\"ADA para makers (computador)\">\n\n<sc-if value=\"{{ isAuth }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex:1;min-height:100vh\">\n  <div style=\"flex:1;background:linear-gradient(135deg,#FF441F,#FF2050);color:#FFFFFF;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n    <div style=\"font-size:48px;font-weight:700\">Ada<\u002Fdiv>\n    <div style=\"font-size:22px;font-weight:600;line-height:1.35;max-width:380px\">Tu espacio para crear campañas con Rappi junto a tu KAM.<\u002Fdiv>\n    <div style=\"font-size:15px;line-height:1.55;max-width:380px;opacity:.95\">Agenda tu sesión del RappiClub, define tu presupuesto, sube tus materiales y mira tus resultados, todo en un lugar.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:32px\">\n    <div style=\"width:100%;max-width:460px\">\n      <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 class=\"h1\">Ingresa a Ada<\u002Fh1>\n        <p class=\"sub\">Si ya eres parte del RappiClub, entra con tu correo.<\u002Fp>\n        <label class=\"lbl\" for=\"lg-mail\">Correo<\u002Flabel>\n        <input id=\"lg-mail\" class=\"fld\" type=\"email\" placeholder=\"tu@marca.com\" sc-camel-on-input=\"{{ onEmail }}\">\n        <label class=\"lbl\" for=\"lg-pass\">Contraseña<\u002Flabel>\n        <input id=\"lg-pass\" class=\"fld\" type=\"password\" placeholder=\"Tu contraseña\" sc-camel-on-input=\"{{ onPass }}\">\n        <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:10px\">\n          <button class=\"btn-p\" sc-camel-on-click=\"{{ doLogin }}\">Ingresar<\u002Fbutton>\n          <button class=\"btn-s\" sc-camel-on-click=\"{{ goReg }}\">Soy nuevo en Ada<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"small\" style=\"margin-top:14px\">P xt }}\">{{ demoLabel }}<\u002Fbutton><\u002Fsc-if>\n          <button class=\"btn-s\" sc-camel-on-click=\"{{ doDemoJump }}\">Saltar a campaña en vivo<\u002Fbutton>\n        <\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFecha }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Fecha y participantes<\u002Fh1>\n      <p class=\"sub\">Elige el día y la hora de tu sesión del RappiClub y escribe quiénes de tu marca participan.<\u002Fp>\n      <div class=\"card\">\n        <div class=\"row\" style=\"justify-content:space-between\"><h2 class=\"h2\" style=\"margin:0\">Agenda de la sesión<\u002Fh2><span class=\"pill\" style=\"background:#FFE9E0;color:#8F2410\">{{ totalMin }} min · aprox. 2 horas<\u002Fspan><\u002Fdiv>\n        <p class=\"sub\" style=\"margin-top:6px\">La sesión sigue este storytelling. Elige tu fecha sabiendo cuánto dura.<\u002Fp>\n        <sc-for list=\"{{ agenda }}\" as=\"a\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid #E6E3EA\">\n            <span class=\"num\" style=\"background:#FFE9E0;color:#8F2410\">{{ a.n }}<\u002Fspan>\n            <div style=\"flex:1\"><div style=\"font-weight:600;font-size:14px\">{{ a.t }}<\u002Fdiv><div class=\"small\">{{ a.d }}<\u002Fdiv><\u002Fdiv>\n            <span class=\"pill\" style=\"background:#EDEAF1;color:#1F1A19\">{{ a.min }} min<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"row\" style=\"justify-content:space-between;margin-bottom:12px\"><h2 class=\"h2\" style=\"margin:0\">{{ calTitle }}<\u002Fh2><span class=\"small\">Los días en gris no tienen cupo<\u002Fspan><\u002Fdiv>\n        <div class=\"cal\">\n          <sc-for list=\"{{ calHeads }}\" as=\"h\" hint-placeholder-count=\"7\"><div class=\"hd\">{{ h.t }}<\u002Fdiv><\u002Fsc-for>\n          <sc-for list=\"{{ calCells }}\" as=\"d\" hint-placeholder-count=\"35\">\n            <button disabled=\"{{ d.dis }}\" aria-pressed=\"{{ d.pressed }}\" aria-label=\"{{ d.aria }}\" style=\"background:{{ d.bg }};border-color:{{ d.bd }};color:{{ d.fg }};font-weight:{{ d.weight }};visibility:{{ d.vis }}\" sc-camel-on-click=\"{{ d.onClick }}\">{{ d.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasDay }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"lbl\" style=\"margin-top:18px\">Horarios disponibles el {{ dayLabel }}<\u002Fdiv>\n          <div class=\"row\" style=\"gap:8px\">\n            <sc-for list=\"{{ hours }}\" as=\"hr\" hint-placeholder-count=\"4\">\n              <button class=\"chip\" disabled=\"{{ hr.dis }}\" aria-pressed=\"{{ hr.pressed }}\" style=\"background:{{ hr.bg }};border-color:{{ hr.bd }};color:{{ hr.fg }};opacity:{{ hr.op }}\" sc-camel-on-click=\"{{ hr.onClick }}\">{{ hr.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h2 class=\"h2\">¿Quiénes van a participar?<\u002Fh2>\n        <div class=\"row\" style=\"flex-wrap:nowrap\"><input class=\"fld\" placeholder=\"Escribe un nombre y apellido\" aria-label=\"Nombre del participante\" sc-camel-on-input=\"{{ onPartInput }}\" sc-camel-on-key-down=\"{{ onPartKey }}\"><button class=\"btn-s\" style=\"flex:none\" sc-camel-on-click=\"{{ addPart }}\">Agregar<\u002Fbutton><\u002Fdiv>\n        <div class=\"row\" style=\"gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ partsList }}\" as=\"pt\" hint-placeholder-count=\"2\">\n            <span class=\"pill\" style=\"background:#E4EEFF;color:#1B4DB3;font-size:13px;padding:6px 8px 6px 12px\">{{ pt.name }} <button aria-label=\"{{ pt.aria }}\" style=\"border:0;background:transparent;color:#1B4DB3;font-size:15px;font-weight:700;min-height:28px;min-width:28px\" sc-camel-on-click=\"{{ pt.onRemove }}\">×<\u002Fbutton><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasDateErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"color:#B3261E;font-size:14px;margin:0 0 12px\">{{ dateErr }}<\u002Fp><\u002Fsc-if>\n      <sc-if value=\"{{ dateOk }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\" style=\"margin-bottom:14px\">Sesión agendada: {{ dateSummary }}. Tu KAM te enviará la confirmación durante hoy o mañana.<\u002Fdiv><\u002Fsc-if>\n      <div class=\"row\"><button class=\"btn-p\" sc-camel-on-click=\"{{ confirmDate }}\">Confirmar fecha<\u002Fbutton><sc-if value=\"{{ dateOk }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn-s\" sc-camel-on-click=\"{{ goObjetivo }}\">Siguiente<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isObjetivo }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Objetivo y agenda<\u002Fh1>\n      <p class=\"sub\">Cuéntanos qué buscas para que lleguemos alineados a la sesión.<\u002Fp>\n      <div class=\"card\">\n        <h2 class=\"h2\">Antes de la sesión<\u002Fh2>\n        <label class=\"lbl\" for=\"q1\">¿Qué te gustaría lograr con esta campaña?<\u002Flabel>\n        <textarea id=\"q1\" class=\"fld\" placeholder=\"Ej: aumentar 20% las ventas netas del canal digital en el primer trimestre\" sc-camel-on-input=\"{{ onQObj }}\"><\u002Ftextarea>\n        <label class=\"lbl\" for=\"q2\">¿Quiénes son tus clientes principales?<\u002Flabel>\n        <textarea id=\"q2\" class=\"fld\" placeholder=\"Ej: consumidores de 25 a 40 años de la Región Metropolitana, segmentos ABC1 y C2\" sc-camel-on-input=\"{{ onQCli }}\"><\u002Ftextarea>\n        <label class=\"lbl\" for=\"q3\">¿Cuáles son tus productos estrella?<\u002Flabel>\n        <textarea id=\"q3\" class=\"fld\" placeholder=\"Ej: línea de barras de proteína, SKU de mayor rotación\" sc-camel-on-input=\"{{ onQProd }}\"><\u002Ftextarea>\n        <label class=\"lbl\" for=\"q4\">¿Has hecho publicidad antes? ¿Cómo te fue?<\u002Flabel>\n        <textarea id=\"q4\" class=\"fld\" placeholder=\"Ej: Meta Ads y retail media en otro marketplace, con ROAS cercano a 2x\" sc-camel-on-input=\"{{ onQPrev }}\"><\u002Ftextarea>\n        <sc-if value=\"{{ hasObjErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"color:#B3261E;font-size:13px;margin:10px 0 0\">{{ objErr }}<\u002Fp><\u002Fsc-if>\n        <div class=\"row\" style=\"margin-top:16px\"><button class=\"btn-p\" sc-camel-on-click=\"{{ sendObj }}\">Enviar mis respuestas<\u002Fbutton><sc-if value=\"{{ objSent }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pill\" style=\"background:#DFF6E8;color:#14633A\">Enviado a tu KAM<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn-s\" sc-camel-on-click=\"{{ toMenu }}\">Volver al menú principal<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReporte }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Tu sesión y reporte<\u002Fh1>\n      <p class=\"sub\">Esto salió de tu sesión. Revísalo, ajusta el presupuesto si quieres y confirma.<\u002Fp>\n      <sc-if value=\"{{ fromOrden }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note b\" style=\"margin-bottom:14px\"><div class=\"p\" style=\"font-weight:700\">Estás corrigiendo tu reporte<\u002Fdiv><div class=\"p\">Puedes pedir un cambio de presupuesto o ajustar el reparto. Cuando termines, vuelve a la orden de compra.<\u002Fdiv><button class=\"btn-p\" sc-camel-on-click=\"{{ backToOrden }}\">Volver a la orden de compra<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n      <div class=\"col3\" style=\"margin-bottom:16px\">\n        <div class=\"tile\"><b>Formato<\u002Fb><span class=\"v\">Banner en home + Turbo<\u002Fspan><span class=\"small\">Ver detalle en el reparto<\u002Fspan><\u002Fdiv>\n        <div class=\"tile\"><b>Horario<\u002Fb><span class=\"v\">12:00 a 15:00 y 19:00 a 21:00<\u002Fspan><span class=\"small\">Del 1 al 14 de diciembre<\u002Fspan><\u002Fdiv>\n        <div class=\"tile\"><b>Presupuesto<\u002Fb><span class=\"v\">{{ budgetFmt }}<\u002Fspan><span class=\"small\">Para toda la campaña<\u002Fspan><a href=\"#budget-card\" class=\"btn-s\" style=\"display:inline-flex;align-items:center;text-decoration:none;font-size:13px;padding:8px 14px;margin-top:4px;align-self:flex-start\">Corregir presupuesto<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"background:#FFFFFF\">\n        <h2 class=\"h2\">Qué estimamos lograr<\u002Fh2>\n        <div class=\"col3\">\n          <div class=\"tile\" style=\"background:#DFF6E8;border-color:#DFF6E8\"><b>Ventas brutas estimadas<\u002Fb><span class=\"v\">{{ ventasFmt }}<\u002Fspan><\u002Fdiv>\n          <div class=\"tile\" style=\"background:#E4EEFF;border-color:#E4EEFF\"><b>Por cada $1 invertido<span class=\"tip\"><span class=\"i\" tabindex=\"0\" aria-label=\"Qué es esto\">i<\u002Fspan><span class=\"tb\" role=\"tooltip\">Es el retorno estimado (ROAS): cuántos pesos de venta esperamos por cada peso en publicidad.<\u002Fspan><\u002Fspan><\u002Fb><span class=\"v\">recuperas {{ roasFmt }}<\u002Fspan><\u002Fdiv>\n          <div class=\"tile\" style=\"background:#FFE9E0;border-color:#FFE9E0\"><b>Ventas netas<\u002Fb><span class=\"v\">~{{ ingNeto }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"small\" style=\"margin:10px 0 0\">Son estimaciones; los resultados reales pueden variar.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h2 class=\"h2\">Quién hace qué y cuándo<\u002Fh2>\n        <sc-if value=\"{{ hasMoreTeam }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"small\" style=\"margin:-4px 0 8px\">Desliza hacia la derecha para ver a todo el equipo →<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px\">\n          <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div class=\"tile\" style=\"gap:4px;flex:0 0 calc(50% - 8px);min-width:250px;box-sizing:border-box;scroll-snap-align:start\">\n              <div class=\"row\" style=\"justify-content:space-between;width:100%\"><span style=\"font-weight:700\">{{ m.name }}<\u002Fspan><span class=\"pill\" style=\"background:{{ m.pbg }};color:#1F1A19\">{{ m.when }}<\u002Fspan><\u002Fdiv>\n              <span class=\"small\">{{ m.role }}<\u002Fspan>\n              <span class=\"p\" style=\"margin:4px 0\">{{ m.task }}<\u002Fspan>\n              <button style=\"border:0;background:transparent;color:#1B4DB3;text-decoration:underline;font-size:13px;padding:0;text-align:left;min-height:32px\" sc-camel-on-click=\"{{ m.onMail }}\">{{ m.mail }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"note b\" style=\"margin-top:14px\">\n            <div class=\"p\" style=\"font-weight:600\">Nuevo mensaje para {{ mailTo }}<\u002Fdiv>\n            <input class=\"fld\" placeholder=\"Asunto\" aria-label=\"Asunto\" sc-camel-on-input=\"{{ onMailSubj }}\">\n            <textarea class=\"fld\" style=\"margin-top:8px\" placeholder=\"Escribe tu mensaje\" aria-label=\"Mensaje\" sc-camel-on-input=\"{{ onMailBody }}\"><\u002Ftextarea>\n            <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn-p\" sc-camel-on-click=\"{{ sendMail }}\">Enviar correo<\u002Fbutton><button class=\"btn-s\" sc-camel-on-click=\"{{ closeMail }}\">Cancelar<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mailSent }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\" style=\"margin-top:14px\">Correo enviado a {{ mailSentTo }}.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div class=\"card\" id=\"budget-card\">\n        <h2 class=\"h2\">Presupuesto<\u002Fh2>\n        <p class=\"sub\" style=\"margin-bottom:10px\">Tu presupuesto actual es {{ budgetFmt }}. Si quieres otro monto, envía una solicitud: tu KAM debe aprobarla antes de que cambie.<\u002Fp>\n        <label class=\"lbl\" for=\"bn\" style=\"margin-top:0\">Monto que te gustaría manejar<\u002Flabel>\n        <div style=\"position:relative;max-width:320px\"><span style=\"position:absolute;left:12px;top:11px;font-weight:600\">$<\u002Fspan><input id=\"bn\" class=\"fld\" style=\"padding-left:28px\" inputmode=\"numeric\" placeholder=\"{{ budgetRaw }}\" sc-camel-on-input=\"{{ onBudget }}\"><\u002Fdiv>\n        <label class=\"lbl\" for=\"bw\">¿Por qué quieres cambiarlo?<\u002Flabel>\n        <textarea id=\"bw\" class=\"fld\" placeholder=\"Ej: quiero partir con menos y probar\" sc-camel-on-input=\"{{ onReason }}\"><\u002Ftextarea>\n        <sc-if value=\"{{ hasBudgetErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"color:#B3261E;font-size:13px;margin:8px 0 0\">{{ budgetErr }}<\u002Fp><\u002Fsc-if>\n        <div class=\"row\" style=\"margin-top:12px\"><button class=\"btn-s\" sc-camel-on-click=\"{{ requestBudget }}\">Solicitar cambio<\u002Fbutton><\u002Fdiv>\n        <sc-if value=\"{{ reqPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"note\" style=\"margin-top:14px\"><div class=\"p\" style=\"font-weight:700\">Impacto estimado por ADA<\u002Fdiv><div class=\"p\">{{ budgetMsg1 }}<\u002Fdiv><div class=\"p\" style=\"margin:0\">{{ budgetMsg2 }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"note b\" style=\"margin-top:10px\"><div class=\"p\" style=\"font-weight:700\">Solicitud enviada: {{ reqBFmt }}<\u002Fdiv><div class=\"p\">Tu KAM la revisa y te avisa. Mientras tanto se mantiene {{ budgetFmt }}. Motivo: «{{ reqWhy }}».<\u002Fdiv>\n            <div class=\"row\"><button class=\"btn-s\" sc-camel-on-click=\"{{ cancelReq }}\">Cancelar solicitud<\u002Fbutton><button class=\"chip\" sc-camel-on-click=\"{{ approveReq }}\">Demo: mi KAM lo aprueba<\u002Fbutton><button class=\"chip\" sc-camel-on-click=\"{{ rejectReq }}\">Demo: mi KAM lo rechaza y propone otro monto<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ reqRej }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note b\" style=\"margin-top:14px\"><div class=\"p\" style=\"font-weight:700\">Tu KAM no aprobó {{ reqBFmt }} y propone {{ altFmt }}<\u002Fdiv><div class=\"p\">{{ altMsg }}<\u002Fdiv><div class=\"row\"><button class=\"btn-p\" sc-camel-on-click=\"{{ acceptAlt }}\">Aceptar {{ altFmt }}<\u002Fbutton><button class=\"btn-s\" sc-camel-on-click=\"{{ keepBudget }}\">Mantener {{ budgetFmt }}<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ reqOk }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\" style=\"margin-top:14px\">Tu KAM aprobó el cambio. Tu presupuesto ahora es {{ budgetFmt }}.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"row\" style=\"justify-content:space-between\"><h2 class=\"h2\" style=\"margin:0\">Así reparte ADA tu presupuesto<\u002Fh2><div style=\"text-align:right\"><div class=\"small\">ROAS estimado<\u002Fdiv><b style=\"font-size:22px\">{{ roasFmt }}<\u002Fb><\u002Fdiv><\u002Fdiv>\n        <div class=\"grid2\" style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:12px\">\n          <div>\n            <span class=\"pill\" style=\"background:#FFE9E0;color:#8F2410;margin-bottom:4px\">Arrastra una tarjeta hacia arriba o abajo. ADA reparte el resto.<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr);padding:34px 0 8px\">\n              <div style=\"position:relative;height:320px\"><sc-for list=\"{{ axis }}\" as=\"t\" hint-placeholder-count=\"5\"><span style=\"position:absolute;right:8px;top:{{ t.top }}%;transform:translateY(-50%);font-size:11px;color:#6B5F5C\">{{ t.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n              <div style=\"position:relative;height:320px\">\n                <sc-for list=\"{{ axis }}\" as=\"g\" hint-placeholder-count=\"5\"><div style=\"position:absolute;left:0;right:0;top:{{ g.top }}%;border-top:1px dashed #E6E3EA\"><\u002Fdiv><\u002Fsc-for>\n                <sc-for list=\"{{ repCols }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"position:absolute;top:0;bottom:0;left:{{ c.left }}%;width:33.333%\">\n                    <div style=\"position:absolute;left:50%;top:{{ c.mTop }}%;height:{{ c.mH }}%;width:3px;margin-left:-1.5px;border-radius:2px;background:{{ c.mBg }};display:{{ c.mDisp }}\"><\u002Fdiv>\n                    <div style=\"position:absolute;left:50%;top:{{ c.oldTop }}%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px dashed #8C7F7B;background:#FFFFFF\"><\u002Fdiv>\n                    <div style=\"position:absolute;left:50%;top:{{ c.top }}%;transform:translate(-50%,-50%);width:94%;max-width:170px;background:#FFFFFF;border:2px solid #D63A1F;border-radius:12px;padding:8px;box-sizing:border-box;box-shadow:0 4px 14px rgba(255,68,31,.18);cursor:grab;touch-action:none;user-select:none\" sc-camel-on-pointer-down=\"{{ c.onDown }}\" sc-camel-on-pointer-move=\"{{ c.onMove }}\" sc-camel-on-pointer-up=\"{{ c.onUp }}\" sc-camel-on-pointer-cancel=\"{{ c.onUp }}\">\n                      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"flex:none;width:28px;height:28px;border-radius:8px;background:{{ c.color }}\"><\u002Fspan><span style=\"min-width:0\"><span style=\"display:block;font-size:11px;font-weight:500;line-height:1.2\">{{ c.name }}<\u002Fspan><span style=\"display:block;font-size:14px;font-weight:700\">{{ c.amt }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:4px\"><span class=\"pill\" style=\"background:{{ c.dbg }};color:{{ c.dfg }};font-size:11px;padding:1px 8px\">{{ c.delta }}<\u002Fspan><span class=\"small\" style=\"font-size:10.5px\">Arrastra<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ c.sv }}\" aria-label=\"{{ c.ariaS }}\" style=\"position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;cursor:grab;writing-mode:vertical-lr;direction:rtl;z-index:3;touch-action:none\" sc-camel-on-input=\"{{ c.onSlide }}\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:52px repeat(3,1fr);font-size:12px;font-weight:600;text-align:center\"><span><\u002Fspan><sc-for list=\"{{ repCols }}\" as=\"x\" hint-placeholder-count=\"3\"><span>{{ x.name }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <div class=\"row small\" style=\"gap:16px;margin-top:12px\"><span><i style=\"display:inline-block;width:12px;height:12px;border-radius:50%;border:2px dashed #8C7F7B;vertical-align:middle;margin-right:6px\"><\u002Fi>Tu punto de partida<\u002Fspan><span><i style=\"display:inline-block;width:3px;height:12px;background:#1F7A4A;vertical-align:middle;margin-right:6px\"><\u002Fi>Sube<\u002Fspan><span><i style=\"display:inline-block;width:3px;height:12px;background:#B3261E;vertical-align:middle;margin-right:6px\"><\u002Fi>Baja<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tile\" style=\"background:#F7F7FA;gap:10px\">\n            <h3 style=\"margin:0;font-size:17px\">Proyección de ADA<\u002Fh3>\n            <sc-for list=\"{{ projRows }}\" as=\"p\" hint-placeholder-count=\"3\"><div style=\"padding:8px 0;border-top:1px solid #E6E3EA\"><div class=\"row\" style=\"justify-content:space-between\"><b style=\"color:#1F1A19;font-size:13px\">{{ p.name }}<\u002Fb><span class=\"pill\" style=\"background:{{ p.dbg }};color:{{ p.dfg }};font-size:11px\">{{ p.delta }}<\u002Fspan><\u002Fdiv><div class=\"small\">de {{ p.from }} a {{ p.to }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:4px\"><span class=\"small\">ROAS estimado<\u002Fspan><span class=\"small\" style=\"text-align:right\">Ingreso neto<\u002Fspan><b style=\"font-size:20px;color:#1F1A19\">{{ roasFmt }}<\u002Fb><b style=\"font-size:20px;color:#1F1A19;text-align:right\">{{ ingNeto }}<\u002Fb><\u002Fdiv>\n            <div class=\"small\">El ingreso neto descuenta promociones y comisión de Rappi (supuesto 20%). Tú apruebas antes de lanzar.<\u002Fdiv>\n            <div class=\"note\" aria-live=\"polite\">{{ adaNote }}<\u002Fdiv>\n            <button class=\"btn-p\" sc-camel-on-click=\"{{ testRep }}\">Probar este reparto<\u002Fbutton>\n            <sc-if value=\"{{ repTest }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\">Listo: ADA preparó tu prueba. Estará disponible a partir del 19 de noviembre, cuando tu KAM la revise.<\u002Fdiv><\u002Fsc-if>\n            <button class=\"btn-s\" sc-camel-on-click=\"{{ resetRep }}\">Volver al reparto propuesto<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\"><button class=\"btn-p\" sc-camel-on-click=\"{{ confirmReport }}\">Confirmar y pasar a la orden de compra<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isOrden }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Orden de compra<\u002Fh1>\n      <p class=\"sub\">Es solo una confirmación con lo que definiste en tu reporte. Si algo está mal, corrígelo allá y vuelve.<\u002Fp>\n      <div class=\"card\">\n        <div class=\"row\" style=\"justify-content:space-between\"><h2 class=\"h2\" style=\"margin:0\">Resumen de tu orden<\u002Fh2><span class=\"pill\" style=\"background:#EDEAF1;color:#1F1A19\">Solo lectura<\u002Fspan><\u002Fdiv>\n        <div class=\"col2\" style=\"margin-top:14px\">\n          <div><div class=\"small\">N° de orden<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">OC-2026-0138<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"small\">Fecha de emisión<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">{{ ocDate }}<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"small\">Comprador<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">Nativa · {{ ownerName }}<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"small\">Proveedor<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">Rappi Chile · Rappi Ads<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:12px;font-size:14px\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;color:#6B5F5C\"><sc-raw-th style=\"padding:8px 0;font-weight:600\">Descripción<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600\">Cantidad<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;text-align:right\">Monto<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ ocLines }}\" as=\"l\" hint-placeholder-count=\"3\"><sc-raw-tr style=\"border-top:1px solid #E6E3EA\"><sc-raw-td style=\"padding:10px 0\">{{ l.d }}<\u002Fsc-raw-td><sc-raw-td>{{ l.q }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ l.m }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for>\n            <sc-raw-tr style=\"border-top:1px solid #E6E3EA\"><sc-raw-td colspan=\"2\" style=\"padding:10px 0\" class=\"mut\">Monto neto<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ ocNeto }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td colspan=\"2\" style=\"padding:6px 0\" class=\"mut\">IVA (19%)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">{{ ocIva }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td colspan=\"2\" style=\"padding:10px 0;font-weight:700\">Total<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-weight:700\">{{ budgetFmt }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <div class=\"col2\" style=\"margin-top:8px\">\n          <div><div class=\"small\">Términos de pago<\u002Fdiv><div class=\"p\">Cargo contra la campaña, según consumo<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"small\">Período de ejecución<\u002Fdiv><div class=\"p\">1 al 14 de diciembre de 2026<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h2 class=\"h2\">Archivo de la orden de compra<\u002Fh2>\n        <sc-if value=\"{{ ocHasFile }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\" style=\"margin-bottom:12px\">Archivo cargado: {{ ocFile }}<\u002Fdiv><\u002Fsc-if>\n        <p class=\"sub\" style=\"margin-bottom:10px\">Sube el PDF de la orden de compra de tu marca desde tus archivos.<\u002Fp>\n        <label class=\"btn-s fl\" style=\"display:inline-flex;align-items:center;position:relative;cursor:pointer\"><span>{{ ocBtn }}<\u002Fspan><input type=\"file\" accept=\".pdf,.png,.jpg,.jpeg\" aria-label=\"Subir archivo de la orden de compra\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\" sc-camel-on-change=\"{{ onOcFile }}\"><\u002Flabel>\n        <div class=\"lbl\">La confirmación se enviará a<\u002Fdiv>\n        <div class=\"row\" style=\"gap:8px\"><span class=\"pill\" style=\"background:#E4EEFF;color:#1B4DB3\">ordenes.ads@rappi.example<\u002Fspan><span class=\"pill\" style=\"background:#E4EEFF;color:#1B4DB3\">andrea.fuentes@rappi.example (tu KAM)<\u002Fspan><span class=\"pill\" style=\"background:#EDEAF1;color:#1F1A19\">{{ ownerMail }} (copia para ti)<\u002Fspan>\n          <sc-for list=\"{{ xmails }}\" as=\"xm\" hint-placeholder-count=\"1\"><span class=\"pill\" style=\"background:#E4EEFF;color:#1B4DB3\">{{ xm.m }} <button aria-label=\"{{ xm.aria }}\" style=\"border:0;background:transparent;color:#1B4DB3;font-weight:700;min-height:28px;min-width:28px\" sc-camel-on-click=\"{{ xm.onRemove }}\">×<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n          <button style=\"border:1.5px dashed #1B4DB3;background:#FFFFFF;color:#1B4DB3;border-radius:999px;font-size:15px;font-weight:700;width:30px;height:30px;padding:0\" aria-label=\"Agregar otro correo\" aria-expanded=\"{{ xmOpen }}\" sc-camel-on-click=\"{{ toggleXm }}\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ xmOpen }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\" style=\"flex-wrap:nowrap;margin-top:10px;max-width:460px\"><input class=\"fld\" type=\"email\" placeholder=\"otro@correo.com\" aria-label=\"Otro correo\" sc-camel-on-input=\"{{ onXm }}\"><button class=\"btn-s\" style=\"flex:none\" sc-camel-on-click=\"{{ addXm }}\">Agregar<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n        <div class=\"row\" style=\"margin-top:16px\">\n          <sc-if value=\"{{ ocCanSend }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn-p\" sc-camel-on-click=\"{{ sendOc }}\">Confirmar y enviar orden<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ ocCantSend }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn-d\" aria-disabled=\"true\">Confirmar y enviar orden<\u002Fbutton><\u002Fsc-if>\n          <button class=\"btn-s\" sc-camel-on-click=\"{{ goReporteBack }}\">Corregir en el reporte<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ocSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card\">\n          <div class=\"row\" style=\"justify-content:space-between\"><h2 class=\"h2\" style=\"margin:0\">Estado de tu orden<\u002Fh2><sc-if value=\"{{ ocOkCase }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"chip\" style=\"min-height:44px;font-size:13px\" sc-camel-on-click=\"{{ showPending }}\">Ver caso: orden pendiente<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ ocPendCase }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"chip\" style=\"min-height:44px;font-size:13px\" sc-camel-on-click=\"{{ showOk }}\">Ver caso: orden en curso<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n          <div style=\"margin-top:12px\">\n            <sc-for list=\"{{ ocSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E6E3EA;opacity:{{ s.op }}\">\n                <span class=\"num\" style=\"background:{{ s.nbg }};color:{{ s.nfg }}\">{{ s.n }}<\u002Fspan>\n                <div style=\"flex:1;font-size:14px;font-weight:600;color:{{ s.fg }}\">{{ s.t }}<\u002Fdiv>\n                <span class=\"pill\" style=\"background:{{ s.pbg }};color:{{ s.pfg }}\">{{ s.st }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ ocPendCase }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"note\" style=\"margin-top:12px\"><div class=\"p\" style=\"font-weight:700\">Orden pendiente: háblale a tu KAM<\u002Fdiv><div class=\"p\">Motivo de Andrea: el archivo no incluye el N° de orden de tu marca. Súbelo de nuevo o coordínalo con ella.<\u002Fdiv><button class=\"btn-p\" sc-camel-on-click=\"{{ meetKam }}\">Agenda una reunión rápida con tu KAM<\u002Fbutton><sc-if value=\"{{ meetSent }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"p\" style=\"margin:10px 0 0;font-weight:600\">Solicitud enviada: Andrea te propondrá un horario hoy.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ ocReady }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn-p\" sc-camel-on-click=\"{{ goMateriales }}\">Siguiente<\u002Fbutton><\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMateriales }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Tus materiales<\u002Fh1>\n      <p class=\"sub\">Con esto creamos tus piezas. Sube lo que tengas; lo demás lo coordinamos con tu KAM.<\u002Fp>\n      <div class=\"card\">\n        <h2 class=\"h2\">Lo clave de tu campaña<\u002Fh2>\n        <div class=\"col2\">\n          <sc-for list=\"{{ matKey }}\" as=\"k\" hint-placeholder-count=\"3\">\n            <div class=\"tile\" style=\"gap:8px\">\n              <b>{{ k.name }}<\u002Fb><span class=\"small\">{{ k.hint }}<\u002Fspan>\n              <label class=\"{{ k.cls }} fl\" style=\"display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer\"><span>{{ k.btn }}<\u002Fspan><input type=\"file\" aria-label=\"{{ k.name }}\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\" sc-camel-on-change=\"{{ k.onFile }}\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"lbl\" style=\"margin-top:18px\">Paleta de colores de tu marca<\u002Fdiv>\n        <p class=\"small\" style=\"margin:0 0 8px\">Sube una imagen con tu paleta o escribe tus códigos Pantone o HEX.<\u002Fp>\n        <label class=\"{{ palCls }} fl\" style=\"display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer\"><span>{{ palBtn }}<\u002Fspan><input type=\"file\" aria-label=\"Subir imagen de paleta\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\" sc-camel-on-change=\"{{ onPalFile }}\"><\u002Flabel>\n        <div class=\"row\" style=\"flex-wrap:nowrap;margin-top:10px;max-width:460px\"><input class=\"fld\" placeholder=\"Ej: Pantone 485 C o #FF441F\" aria-label=\"Código de color\" sc-camel-on-input=\"{{ onCode }}\" sc-camel-on-key-down=\"{{ onCodeKey }}\"><button class=\"btn-s\" style=\"flex:none\" sc-camel-on-click=\"{{ addCode }}\">Agregar<\u002Fbutton><\u002Fdiv>\n        <div class=\"row\" style=\"gap:8px;margin-top:10px\">\n          <sc-for list=\"{{ codeList }}\" as=\"cd\" hint-placeholder-count=\"2\"><span class=\"pill\" style=\"background:#E4EEFF;color:#1B4DB3;font-size:13px;padding:6px 8px 6px 12px\">{{ cd.c }} <button aria-label=\"{{ cd.aria }}\" style=\"border:0;background:transparent;color:#1B4DB3;font-size:15px;font-weight:700;min-height:28px;min-width:28px\" sc-camel-on-click=\"{{ cd.onRemove }}\">×<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <label class=\"lbl\" for=\"slg\">Tu slogan<\u002Flabel>\n        <input id=\"slg\" class=\"fld\" placeholder=\"Ej: Snacks de verdad, sin vueltas\" sc-camel-on-input=\"{{ onSlogan }}\">\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h2 class=\"h2\">Fotos<\u002Fh2>\n        <div class=\"lbl\" style=\"margin-top:0\">Fotos con hero <span class=\"small\">(el producto protagonista, con fondo limpio)<\u002Fspan><\u002Fdiv>\n        <label class=\"{{ heroCls }} fl\" style=\"display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer\"><span>{{ heroBtn }}<\u002Fspan><input type=\"file\" aria-label=\"Subir foto hero\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\" sc-camel-on-change=\"{{ onHeroFile }}\"><\u002Flabel>\n        <div class=\"lbl\">Fotos sin hero <span class=\"small\">(por categoría)<\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"gap:10px\">\n          <sc-for list=\"{{ photoCats }}\" as=\"c\" hint-placeholder-count=\"3\"><label class=\"{{ c.cls }} fl\" style=\"display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer\"><span>{{ c.btn }}<\u002Fspan><input type=\"file\" aria-label=\"{{ c.btn }}\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%\" sc-camel-on-change=\"{{ c.onFile }}\"><\u002Flabel><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasMatErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"color:#B3261E;font-size:13px;margin:0 0 10px\">{{ matErr }}<\u002Fp><\u002Fsc-if>\n      <sc-if value=\"{{ matNotSent }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn-p\" sc-camel-on-click=\"{{ sendMat }}\">Enviar materiales<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ matSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card\">\n          <h2 class=\"h2\">Materiales enviados<\u002Fh2>\n          <sc-for list=\"{{ sentList }}\" as=\"s\" hint-placeholder-count=\"4\">\n er-val=\"{{ false }}\"><div class=\"note\">Se activa cuando tu campaña esté en vivo. Mira «Lanzamiento y resultados».<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ launched }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div class=\"card\" style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;opacity:{{ s.op }}\">\n            <div style=\"flex:1;min-width:240px\"><div class=\"p\" style=\"font-weight:700;margin:0 0 4px\">{{ s.t }}<\u002Fdiv><div class=\"small\">{{ s.d }}<\u002Fdiv><div class=\"pill\" style=\"background:#DFF6E8;color:#14633A;margin-top:8px\">{{ s.gain }}<\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{ s.isPending }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"row\"><button class=\"btn-p\" sc-camel-on-click=\"{{ s.onApply }}\">Aplicar<\u002Fbutton><button class=\"btn-s\" sc-camel-on-click=\"{{ s.onIgnore }}\">Ignorar<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ s.isDecided }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"row\"><span class=\"pill\" style=\"background:#EDEAF1;color:#1F1A19\">{{ s.state }}<\u002Fspan><button class=\"btn-s\" sc-camel-on-click=\"{{ s.onUndo }}\">Deshacer<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn-p\" sc-camel-on-click=\"{{ applyAll }}\">Aplicar las {{ pendingCount }} sugerencias<\u002Fbutton><\u002Fsc-if>\n        <div class=\"card\" style=\"margin-top:16px\">\n          <h2 class=\"h2\">Lo que ya le llegó a tu KAM<\u002Fh2>\n          <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ true }}\"><p class=\"small\" style=\"margin:0\">Aún no hay acciones. Cuando apliques o ignores una sugerencia, Andrea la verá en su plataforma.<\u002Fp><\u002Fsc-if>\n          <sc-for list=\"{{ logLines }}\" as=\"l\" hint-placeholder-count=\"2\"><div st p:8px\"><sc-for list=\"{{ closeHours }}\" as=\"h\" hint-placeholder-count=\"3\"><button class=\"chip\" aria-pressed=\"{{ h.pressed }}\" style=\"background:{{ h.bg }};border-color:{{ h.bd }};color:{{ h.fg }}\" sc-camel-on-click=\"{{ h.onClick }}\">{{ h.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <div class=\"lbl\">¿Qué te gustaría hacer después?<\u002Fdiv>\n          <div class=\"row\" style=\"gap:8px\"><sc-for list=\"{{ nextOpts }}\" as=\"n\" hint-placeholder-count=\"4\"><button class=\"chip\" aria-pressed=\"{{ n.pressed }}\" style=\"background:{{ n.bg }};border-color:{{ n.bd }};color:{{ n.fg }}\" sc-camel-on-click=\"{{ n.onClick }}\">{{ n.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <sc-if value=\"{{ nxtOther }}\" hint-placeholder-val=\"{{ false }}\"><input class=\"fld\" style=\"margin-top:8px\" placeholder=\"Cuéntanos qué te gustaría hacer\" aria-label=\"Otra opción\" sc-camel-on-input=\"{{ onNxtO }}\"><\u002Fsc-if>\n          <div class=\"lbl\">¿Para qué temporada sería tu próxima campaña?<\u002Fdiv>\n          <div class=\"row\" style=\"gap:8px\"><sc-for list=\"{{ seasons }}\" as=\"t\" hint-placeholder-count=\"4\"><button class=\"chip\" aria-pressed=\"{{ t.pressed }}\" style=\"background:{{ t.bg }};border-color:{{ t.bd }};color:{{ t.fg }}\" sc-camel-on-click=\"{{ t.onClick }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n          <sc-if value=\"{{ seasonOther }}\" hint-placeholder-val=\"{{ false }}\"><input class=\"fld\" style=\"margin-top:8px\" placeholder=\"Ej: Fiestas Patrias\" aria-label=\"Otra temporada\" sc-camel-on-input=\"{{ onSeaO }}\"><\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <h2 class=\"h2\">¿Cómo te fue con Ada?<\u002Fh2>\n          <div class=\"row\" style=\"gap:6px\" role=\"group\" aria-label=\"Califica tu experiencia\">\n            <sc-for list=\"{{ staches }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <button class=\"mstache\" aria-pressed=\"{{ s.pressed }}\" aria-label=\"{{ s.label }}\" sc-camel-on-click=\"{{ s.onClick }}\">\n                <svg width=\"46\" height=\"30\" sc-camel-view-box=\"0 0 46 30\" aria-hidden=\"true\" style=\"opacity:{{ s.op }}\"><g transform=\"translate(0,30) scale(1,-1)\"><path d=\"M3 20c3-11 12-13 20-6 8-7 17-5 20 6-5-3-10-2-15 1-3 2-7 2-10 0-5-3-10-4-15-1z\" fill=\"{{ s.fill }}\"><\u002Fpath><\u002Fg><\u002Fsvg>\n                <span>{{ s.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasCloseErr }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"color:#B3261E;font-size:13px;margin:0 0 10px\">{{ closeErr }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ campClosed }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note g\" style=\"margin-bottom:12px\">Cierre confirmado. Tu reunión de cierre: {{ closeSummary }}. Tu KAM recibió el resumen de la campaña.<\u002Fdiv><\u002Fsc-if>\n        <div class=\"row\"><button class=\"btn-s\" sc-camel-on-click=\"{{ toMenu }}\">Volver al menú principal<\u002Fbutton><button class=\"btn-p\" sc-camel-on-click=\"{{ closeCamp }}\">Confirmar cierre de campaña<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPerfil }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Mi perfil<\u002Fh1>\n      <div class=\"card\"><div class=\"row\" style=\"gap:16px\"><span class=\"avatar\" style=\"width:56px;height:56px;font-size:22px\">{{ initial }}<\u002Fspan><div><div class=\"p\" style=\"font-weight:700;margin:0\">{{ ownerName }}<\u002Fdiv><div class=\"small\">{{ ownerMail }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"col2\" style=\"margin-top:14px\"><div><div class=\"small\">Marca<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">{{ bizName }}<\u002Fdiv><\u002Fdiv><div><div class=\"small\">Tu KAM<\u002Fdiv><div class=\"p\" style=\"font-weight:600\">Andrea Fuentes<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNotifs }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Notificaciones<\u002Fh1>\n      <div class=\"card\">\n        <sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"3\"><div style=\"padding:10px 0;border-top:1px solid #E6E3EA;font-size:14px\">{{ n.t }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAyuda }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 class=\"h1\">Ayuda<\u002Fh1>\n      <p class=\"sub\">Preguntas frecuentes sobre el RappiClub y Ada. Para algo puntual, escribe a tu KAM: andrea.fuentes@rappi.example.<\u002Fp>\n      <div class=\"card\">\n        <sc-for list=\"{{ allFaqs }}\" as=\"f\" hint-placeholder-count=\"5\"><div style=\"padding:10px 0;border-top:1px solid #E6E3EA\"><div class=\"p\" style=\"font-weight:600;margin:0 0 4px\">{{ f.q }}<\u002Fdiv><div class=\"small\">{{ f.a }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <aside class=\"aside\" aria-label=\"Preguntas frecuentes\">\n    <div class=\"card\" style=\"padding:16px;margin:0\">\n      <button style=\"width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;padding:0;font-size:14px;font-weight:700;color:#1F1A19;min-height:44px\" aria-expanded=\"{{ faqOpen }}\" sc-camel-on-click=\"{{ toggleFaq }}\"><span>Preguntas frecuentes<\u002Fspan><span aria-hidden=\"true\">{{ faqSym }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ faqOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"border-top:1px solid #E6E3EA\"><button style=\"width:100%;text-align:left;background:transparent;border:0;padding:10px 0;font-size:13px;font-weight:600;color:#1F1A19;min-height:44px\" aria-expanded=\"{{ f.open }}\" sc-camel-on-click=\"{{ f.onClick }}\">{{ f.q }}<\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"small\" style=\"padding:0 0 10px;line-height:1.5\">{{ f.a }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100}}\">\nclass Component extends DCLogic {\n  defaults() {\n    return {\n      stage: 'login', screen: 'menu', menuOpen: false, authErr: '',\n      biz: 'Nativa', rubro: '', per: 0, reqRej: false, altB: 0, repTest: false, fromOrden: false, xmails: [], xmOpen: false, matNames: {}, kamConf: false, sesion: false, reqB: 0, reqWhy: '', reqOk: false, moved: -1, palImg: false, codes: [], cDay: -1, cHour: -1, nxt: -1, season: -1, closeErr: '', bizPick: false, bizCustom: false, bizQ: '', extra: 0, owner: 'Camila Soto', email: 'camila@nativa.example', \n      faqOpen: true, faqIdx: -1,\n      selDay: 0, selHour: -1, parts: ['Camila Soto'], dateOk: false, dateErr: '',\n      objSent: false, objErr: '',\n      budget: 200000, bTouched: false, bErr: '', P: [0.5, 0.28, 0.22], repOk: false,\n      mailOpen: -1, mailSentTo: '',\n      ocFile: '', ocSent: false, ocStage: 0, ocCase: 'ok', meetSent: false,\n      mat: { logo: false, brand: false, hero: false, c0: false, c1: false, c2: false }, pal: [0], slogan: '', matSent: false, matStage: 0, matErr: '',\n      showMock: false, approval: 0, piecesApproved: false, changesOpen: false, changesSent: false,\n      launched: false, tab: 0, sugg: ['p', 'p', 'p'], log: [], Ppre: null, repMode: -1, rating: 0, campClosed: false\n    };\n  }\n\n  st() { return Object.assign({}, this.defaults(), this.state || {}); }\n  inp(k) { return (e) => { this._in = this._in || {}; this._in[k] = (e && e.target) ? e.target.value : ''; }; }\n\n  renderVals() {\n    const S = this.st();\n    this._in = this._in || {};\n    const IN = this._in;\n    const money = (n) => '$' + Math.round(n).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    const dec = (n) => String(n).replace('.', ',');\n    const REC = [0.5, 0.28, 0.22];\n    const TYP = ['Banner en home', 'Turbo', 'Por zona'];\n    const THC = ['#FFB020', '#FF8A6B', '#9B86F5'];\n    const roasOf = (P) => {\n      let a = 0, b = 0;\n      for (let i = 0; i < 3; i++) { a += Math.pow(REC[i], 0.3) * Math.pow(P[i], 0.7); b += Math.abs(P[i] - REC[i]); }\n      return Math.max(0.8, Math.round((3.2 * a - 3.0 * b) * 10) / 10);\n    };\n    const cs = (on) => ({ bg: on ? '#FFE9E0' : '#FFFFFF', bd: on ? '#D63A1F' : '#E6E3EA', fg: on ? '#8F2410' : '#1F1A19', pressed: on ? 'true' : 'false' });\n    const set = (o) => () => this.setState(o);\n    const go = (id) => () => this.setState({ screen: id, menuOpen: false, faqIdx: -1 });\n    const P = S.P;\n    const owner = S.owner;\n    const first = owner.split(' ')[0];\n\n    /* ---------- auth ---------- */\n    const BR = [['Coca-Cola', 'Alimentos y bebidas'], ['Pepsi', 'Alimentos y bebidas'], ['Cachantun', 'Alimentos y bebidas'], ['Nestlé', 'Alimentos y bebidas'], ['Carozzi', 'Alimentos y bebidas'], ['Savory', 'Alimentos y bebidas'], ['Dove', 'Belleza y cuidado'], ['Nivea', 'Belleza y cuidado'], ['Maybelline', 'Belleza y cuidado'], ['Adidas', 'Moda'], ['Nike', 'Moda'], ['Samsonite', 'Moda'], ['Samsung', 'Hogar y tecnología'], ['Huggies', 'Hogar y tecnología'], ['Philips', 'Hogar y tecnología']];\n    const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n    const qn = norm(S.bizQ.trim());\n    const hits = qn ? BR.filter((b) => norm(b[0]).indexOf(qn) >= 0).slice(0, 5) : [];\n    const showSugg = !!qn && !S.bizPick && !S.bizCustom;\n    const exact = hits.some((b) => norm(b[0]) === qn);\n    const bizOpts = hits.map((b) => ({ name: b[0], rubro: b[1], onClick: () => {\n      if (this._bizEl) this._bizEl.value = b[0];\n      IN.biz = b[0
